<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cesta dějinami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800;900&family=Alegreya+Sans:wght@400;500;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#e6ede3; --panel:#fbfaf5; --ink:#1f2c35; --muted:#5d6b73; --line:#c9d3c6;
  --good:#3d7a3f; --bad:#b23a30; --gold:#b8862b; --accent:#a8322d;
  --btn:#1f2c35; --btnInk:#fbfaf5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172026; --panel:#212d34; --ink:#eef1ea; --muted:#9fb0b6; --line:#35454d;
    --good:#7cc47e; --bad:#ef7b6f; --gold:#e3b456; --btn:#eef1ea; --btnInk:#172026;
  }
}
:root[data-theme="dark"]{
  --bg:#172026; --panel:#212d34; --ink:#eef1ea; --muted:#9fb0b6; --line:#35454d;
  --good:#7cc47e; --bad:#ef7b6f; --gold:#e3b456; --btn:#eef1ea; --btnInk:#172026;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alegreya Sans","Trebuchet MS",Arial,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:"Alegreya",Georgia,serif;font-weight:900;line-height:1.08;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)}
.primary{background:var(--btn);color:var(--btnInk);border:0;padding:13px 24px;font-weight:800;font-size:18px;border-radius:999px}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:transparent;border:2px solid var(--line);padding:9px 16px;border-radius:999px;font-weight:700}
.ghost:hover{border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 0 14px;border-bottom:3px solid var(--ink);margin-bottom:20px}
.top .me{display:flex;align-items:center;gap:10px;margin-right:auto}
.top .me svg{width:44px;height:62px}
.top .me b{font-family:"Alegreya",Georgia,serif;font-size:24px}
.hp{min-width:150px}
.hp .lbl{font-size:14px;font-weight:700}
.hp .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.hp .fill{height:100%;background:var(--bad);transition:width .4s}
.money{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px}
.coin{width:24px;height:24px;flex:none}

/* creator */
.hero{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.stage{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;justify-content:center;position:sticky;top:12px}
.stage svg{width:200px;height:280px}
@media (max-width:720px){.stage{position:static}.stage svg{width:150px;height:210px}}
.title{font-size:clamp(46px,9vw,88px);letter-spacing:-.02em;margin:10px 0 6px}
.lead{max-width:52ch;color:var(--muted);margin:0 0 20px;font-size:19px}
.opt{margin-bottom:16px}
.opt h3{font-family:"Alegreya Sans",sans-serif;font-weight:800;font-size:16px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:999px;font-weight:700;font-size:16px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
input[type=text]{font:inherit;font-size:20px;background:var(--panel);color:var(--ink);border:2px solid var(--line);padding:10px 14px;border-radius:12px;width:100%;max-width:340px}

/* map */
.timeline{position:relative;padding-left:34px;margin-top:10px}
.timeline::before{content:"";position:absolute;left:13px;top:8px;bottom:8px;width:4px;background:var(--line);border-radius:2px}
.era{position:relative;display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.era::before{content:"";position:absolute;left:-29px;top:50%;width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid var(--bg);transform:translateY(-50%)}
.era:not(:disabled):hover{border-color:var(--c)}
.era:disabled{opacity:.5;cursor:not-allowed}
.era .yr{font-size:14px;font-weight:700;color:var(--muted)}
.era h3{font-size:24px}
.era .st{margin-left:auto;font-weight:800;font-size:15px;white-space:nowrap;color:var(--c)}
.era.cur{border-color:var(--c);box-shadow:inset 6px 0 0 var(--c)}

/* era hub */
.band{background:var(--c);color:#fff;border-radius:20px;padding:22px 22px 20px;margin-bottom:18px;position:relative;overflow:hidden}
.band h2{font-size:clamp(36px,6vw,56px)}
.band p{margin:6px 0 0;max-width:60ch;opacity:.95}
.band .yr{font-weight:800;opacity:.85}
.cur-note{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:2px dashed var(--c);border-radius:16px;padding:14px 16px;margin-bottom:18px}
.cur-note .coin{width:44px;height:44px}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.task{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.task:hover{border-color:var(--c)}
.task .ic{font-size:34px;line-height:1}
.task h3{font-size:24px}
.task .s{margin-top:auto;font-weight:800;font-size:15px}
.task.done{border-color:var(--good)}
.task.done .s{color:var(--good)}

/* card */
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:24px}
.card h2{font-size:clamp(30px,5vw,42px);margin-bottom:10px}
.big{font-size:22px;line-height:1.5;max-width:56ch;margin:0 0 18px}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--c)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.answers{grid-template-columns:1fr}}
.ans{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;text-align:left;font-weight:700;font-size:18px}
.ans:not(:disabled):hover{border-color:var(--ink)}
.ans.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--panel))}
.ans.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--panel))}
.ans.gone{visibility:hidden}
.ans:disabled{cursor:default}
.fb{border-radius:14px;padding:14px 16px;margin:16px 0;max-width:62ch}
.fb.g{background:color-mix(in srgb,var(--good) 16%,transparent)}
.fb.b{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;min-height:54px;background:transparent;text-align:left;width:100%}
.slot.full{border-style:solid;border-color:var(--c);background:var(--bg)}
.slot .n{font-family:"Alegreya",Georgia,serif;font-weight:900;font-size:24px;width:28px;color:var(--c)}
.slot .y{margin-left:auto;font-size:15px;color:var(--muted);font-weight:700}
.slot.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.slot.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pool button{border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:9px 16px;font-weight:800}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.item{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.item .ic{font-size:30px}
.item b{font-size:18px}
.item .d{font-size:15px;color:var(--muted)}
.item .buy{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.item .buy button{border:0;background:var(--btn);color:var(--btnInk);border-radius:999px;padding:7px 14px;font-weight:800}
.item .buy button:disabled{opacity:.35;cursor:not-allowed}
.sect{font-size:26px;margin:22px 0 10px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnInk);padding:12px 22px;border-radius:999px;font-weight:800;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.hp .fill{transition:none}}
.foot{margin-top:30px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
.hp.low .lbl{color:var(--bad)}
.hp.low .track{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{top:110%;transform:translateX(60px) rotate(720deg)}}
.win{text-align:center}
.trophy svg{width:150px;height:150px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.wintitle{font-size:clamp(52px,10vw,96px);color:var(--gold);margin:6px 0 8px}
.diploma{display:flex;gap:22px;align-items:center;text-align:left;max-width:640px;margin:0 auto;background:var(--panel);border:4px double var(--gold);border-radius:18px;padding:22px 24px}
@media (max-width:560px){.diploma{flex-direction:column;text-align:center}}
.diploma .dav{width:130px;flex:none}
.diploma .dl{font-family:"Alegreya",Georgia,serif;font-weight:900;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.diploma h3{font-size:32px;margin:2px 0 8px}
.diploma p{margin:0}
.dstats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:16px}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.trophy svg{animation:none}.hp.low .track{animation:none}}
.starve{background:var(--bad);color:#fff;font-weight:800;border-radius:14px;padding:10px 16px;margin:-8px 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;animation:blink 1.2s infinite}
.starve button{border:0;background:#fff;color:var(--bad);border-radius:999px;padding:6px 14px;font-weight:800}
@media (prefers-reduced-motion:reduce){.starve{animation:none}}
/* šatník */
.shop{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.preview{position:sticky;top:12px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px}
.preview .pv svg{width:100%;height:auto;display:block}
.trybox{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;margin-top:6px}
.trybox .primary{padding:10px}
@media (max-width:720px){.shop{grid-template-columns:1fr}.preview{top:0;z-index:5;display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:10px}.preview .pv{grid-row:span 3}.preview>button{margin-top:0!important}}
.tabs{margin-bottom:16px}
.wardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.ward{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ward:hover{border-color:var(--ink)}
.ward.on{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.ward.try{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.ward .mini svg{width:100%;height:auto;display:block}
.ward b{font-size:15px;line-height:1.2}
.ward .tag{font-size:13px;font-weight:800;color:var(--muted)}
.ward .tag.price{color:var(--gold)}
.ward.on .tag{color:var(--good)}
.top .me svg{width:62px;height:62px}
.stage svg{width:260px;height:260px}
@media (max-width:720px){.stage svg{width:200px;height:200px}}
.task.locked{border-style:dashed}
.task.bonus{background:color-mix(in srgb,var(--c) 7%,var(--panel))}
.pex{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.pex{grid-template-columns:repeat(3,1fr)}}
.pc{min-height:86px;border-radius:14px;border:2px solid var(--c);background:var(--c);color:#fff;font-weight:800;font-size:16px;padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .2s}
.pc .q{font-family:"Alegreya",Georgia,serif;font-size:36px;opacity:.9}
.pc.up{background:var(--panel);color:var(--ink)}
.pc.up.y{background:color-mix(in srgb,var(--gold) 16%,var(--panel))}
.pc.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel));opacity:.8}
.tfy{border-color:var(--good);text-align:center;font-size:20px}
.tfn{border-color:var(--bad);text-align:center;font-size:20px}
.gap{display:inline-block;min-width:60px;border-bottom:3px solid var(--c);text-align:center;font-weight:800;color:var(--c)}
.clue{display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--c) 12%,var(--panel));border:2px solid var(--c);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.clue b{font-size:22px}
.pexboard{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/2;max-width:640px}
.pexpic{position:absolute;inset:0;width:100%;height:100%}
.pexboard .pex{position:absolute;inset:0;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:4px;padding:0}
@media (max-width:560px){.pexboard{aspect-ratio:3/4}.pexboard .pex{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr)}}
.pexboard .pc{min-height:0;border-radius:10px}
.pexboard .pc.done{background:transparent;border-color:transparent;opacity:1}
.pexboard .pc.up{background:color-mix(in srgb,var(--panel) 94%,transparent);font-size:14px;line-height:1.22;overflow:hidden}
.pexboard .pc.sel{border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--panel))}
.pexboard .pc.up:not(:disabled):hover{border-color:var(--ink)}
.pexboard .pc.done .lab{background:#000000a0;color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;animation:fadeLab 2.5s forwards}
@keyframes fadeLab{0%,60%{opacity:1}100%{opacity:0}}
.pexboard .pc.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--panel))}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ================= DOBY ================= */
const ERAS=[
{id:'keltove',n:'Keltové',y:'asi 4.–1. století př. n. l.',c:'#3f7d4a',cur:['duhovky','duhovek','duhovka'],
 intro:'Dávno předtím, než přišli Slované, žili v Čechách Keltové. Byli to zruční kováři a obchodníci.',
 coin:'Keltové razili malé zlaté mince prohnuté do tvaru misky. Lidé je později nacházeli po dešti na polích a věřili, že spadly z duhy. Proto se jim říká duhovky.',
 facts:['Keltský kmen Bójů žil v Čechách asi od 4. století před naším letopočtem. Podle nich Římané pojmenovali naši zemi Boiohaemum, odtud pochází latinské jméno Bohemia.',
  'Keltové stavěli velká opevněná sídla zvaná oppida. Jedno z největších bylo Závist u Prahy, další bylo například ve Stradonicích u Berouna.',
  'Keltové byli skvělí kováři a uměli zpracovávat železo. Proto patří do doby železné.',
  'Duhovky jsou drobné zlaté keltské mince tvaru misky. Lidé věřili, že padají na zem tam, kde končí duha.',
  'Velkou úctu měli u Keltů kněží zvaní druidové. Byli to učenci, soudci a znalci přírody.'],
 order:{t:'Seřaď doby',items:[{n:'Doba kamenná',y:'nejstarší'},{n:'Doba bronzová',y:'asi od 2000 př. n. l.'},{n:'Doba železná a Keltové',y:'asi od 800 př. n. l.'},{n:'Příchod Slovanů',y:'6. století n. l.'}]},
 qs:[{q:'Podle kterého keltského kmene dostaly Čechy latinské jméno Bohemia?',a:['Podle Bójů','Podle Markomanů','Podle Slovanů','Podle Římanů'],x:'Římané naši zemi podle Bójů nazývali Boiohaemum, země Bójů.'},
  {q:'Jak se říká velkým opevněným sídlům Keltů?',a:['Oppida','Kláštery','Tvrze','Paláce'],x:'Oppidum bylo velké keltské hradiště obehnané valy.'},
  {q:'Proč se keltským mincím říká duhovky?',a:['Lidé věřili, že padají z duhy','Byly barevné jako duha','Razil je král Duha','Platilo se jimi za déšť'],x:'Mince se po dešti objevovaly v hlíně na polích, a tak vznikla pověst o duze.'},
  {q:'Jaký kov Keltové skvěle zpracovávali?',a:['Železo','Hliník','Titan','Platinu'],x:'Keltové žili v době železné a byli výborní kováři.'},
  {q:'Jak se jmenovali keltští kněží?',a:['Druidové','Mniši','Rytíři','Šamani'],x:'Druidové byli u Keltů kněží, učenci i soudci.'},
  {q:'Které velké keltské oppidum leželo u Prahy?',a:['Závist','Karlštejn','Tábor','Kutná Hora'],x:'Oppidum Závist leželo na jižním okraji dnešní Prahy.'}]},

{id:'morava',n:'Velká Morava',y:'asi 833–906',c:'#8a5a2b',cur:['hřivny','hřiven','hřivna'],
 intro:'Velká Morava byla první velký stát Slovanů na našem území. Přišli sem věrozvěstové Cyril a Metoděj.',
 coin:'Na Velké Moravě se ještě nepoužívaly mince. Platilo se mimo jiné železnými sekerovitými hřivnami, které vypadaly jako malé ploché sekery.',
 facts:['Velká Morava byla první velký státní útvar Slovanů na našem území. Existovala zhruba od roku 833 do počátku 10. století.',
  'Roku 863 přišli na pozvání knížete Rastislava bratři Konstantin a Metoděj ze Soluně. Konstantin přijal před smrtí jméno Cyril.',
  'Konstantin vytvořil pro slovanský jazyk první písmo, které se jmenuje hlaholice.',
  'Nejslavnějším vládcem byl Svatopluk I. Podle pověsti ukázal synům, že tři pruty svázané dohromady nikdo nezlomí, ale jednotlivé ano. Chtěl, aby drželi při sobě.',
  'Velkou Moravu na počátku 10. století rozvrátily nájezdy starých Maďarů.'],
 order:{t:'Seřaď velkomoravské vládce',items:[{n:'Mojmír I.',y:'asi 830–846'},{n:'Rastislav',y:'846–870'},{n:'Svatopluk I.',y:'871–894'},{n:'Mojmír II.',y:'894–asi 906'}]},

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ================= GENERÁTOR OTÁZEK ================= */
const GAPS={premyslovci:1,ceskoslovensko:1};
const KIND={keltove:'doby',husite:'events',ceskoslovensko:'pres',cesko:'pres'};
function parseItems(e){
  return e.order.items.map((it,i)=>{
    const o={...it,i}; const y=it.y;
    if(/asi|přestávkou|nejstarší|století/.test(y)){ o.approx=true; }
    let m=y.match(/^(\d{3,4})–(\d{4})$/); if(m&&!o.approx){ o.s=+m[1]; o.e=+m[2]; o.d=o.e-o.s; }
    m=y.match(/^(\d{4})$/); if(m){ o.s=+m[1]; }
    m=y.match(/^od (\d{4})$/); if(m){ o.s=+m[1]; }
    o.f=/Marie Terezie/.test(it.n);
    return o;
  });
}
const yrs=n=>n===1?'1 rok':n<5?`${n} roky`:`${n} let`;
function pick3(correct,pool){ return shuffle([...new Set(pool.filter(x=>x!==correct))]).slice(0,3); }
function fakeDur(d,have){ const set=new Set(have.filter(x=>x!==d&&x>0)); const deltas=shuffle([3,5,7,10,12,15,20,-3,-5,-7,-10]); for(const k of deltas){ if(set.size>=3) break; const v=d+k; if(v>0&&v!==d) set.add(v);} return shuffle([...set]).slice(0,3); }
function genQs(e){
  const K=KIND[e.id]||'rulers', it=parseItems(e), out=[], names=it.map(x=>x.n);
  const V=x=>K==='pres'?(x.f?'byla prezidentkou':'byl prezidentem'):(x.f?'vládla':'vládl');
  const Kdo=K==='pres'?'Kdo byl prezidentem':'Kdo vládl';
  const on=x=>x.f?'ní':'něm';
  const when=x=>/^od (\d{4})$/.test(x.y)?`od roku ${x.y.slice(3)}`:/^(asi )?\d/.test(x.y)?`v letech ${x.y}`:`v době: ${x.y}`;
  it.forEach((x,k)=>{
    if(K==='rulers'||K==='pres'){
      // délka vlády
      if(x.d){ const others=it.filter(z=>z.d).map(z=>z.d); const w=fakeDur(x.d,others); if(w.length===3) out.push({q:`Jak dlouho ${V(x)} ${x.n}?`,a:[yrs(x.d),...w.map(yrs)],x:`${x.n} ${V(x)} ${when(x)}, tedy ${yrs(x.d)}.`}); }
      // kdo v letech
      const w=pick3(x.n,names); if(w.length>=1) out.push({q:`${Kdo} ${when(x)}?`,a:[x.n,...w],x:`${when(x)[0].toUpperCase()+when(x).slice(1)} ${V(x)} ${x.n}.`});
      // po / před
      if(k<it.length-1&&!GAPS[e.id]){ const nx=it[k+1]; const w2=pick3(nx.n,names.filter(n=>n!==x.n)); if(w2.length) out.push({q:`${x.n} ${V(x)} ${when(x)}. ${Kdo} hned po ${on(x)}?`,a:[nx.n,...w2],x:`Po ${x.f?'ní':'něm'} ${nx.f?'přišla':'přišel'} ${nx.n} (${nx.y}).`}); }
      if(k>0&&!GAPS[e.id]){ const pv=it[k-1]; const w2=pick3(pv.n,names.filter(n=>n!==x.n)); if(w2.length) out.push({q:`${x.n} ${V(x)} ${when(x)}. ${Kdo} těsně před ${x.f?'ní':'ním'}?`,a:[pv.n,...w2],x:`Před ${x.f?'ní':'ním'} ${V(pv)} ${pv.n} (${pv.y}).`}); }
      // rok nástupu
      if(x.s&&!x.approx){ const ys=it.filter(z=>z.s&&z.s!==x.s).map(z=>String(z.s)); const extra=[x.s-10,x.s+10,x.s-25,x.s+25].map(String); const w3=pick3(String(x.s),ys.concat(extra)); out.push({q:`V jakém roce začal${x.f?'a':''} ${K==='pres'?'být prezidentem':'vládnout'} ${x.n}?`,a:[String(x.s),...w3],x:`${x.n}: ${x.y}.`}); }
    }
    if(K==='events'){
      const w=pick3(String(x.s),it.map(z=>String(z.s)).concat([String(x.s-3),String(x.s+2)]));
      out.push({q:`Ve kterém roce se stalo: ${x.n}?`,a:[String(x.s),...w],x:`${x.n}: roku ${x.s}.`});
      out.push({q:`Co se stalo roku ${x.s}?`,a:[x.n,...pick3(x.n,names)],x:`Roku ${x.s}: ${x.n}.`});
    }
    if(K==='doby'&&k<it.length-1){ const nx=it[k+1]; out.push({q:`Co přišlo hned po tomhle období: ${x.n}?`,a:[nx.n,...pick3(nx.n,names.filter(n=>n!==x.n))],x:`Po období ${x.n} přišlo: ${nx.n}.`}); }
  });
  // co bylo dřív
  for(let t=0;t<3;t++){ const [a,b]=shuffle(it).slice(0,2); if(!a||!b) break; const first=a.i<b.i?a:b, second=first===a?b:a;
    out.push({q:K==='rulers'?`Kdo vládl dřív?`:K==='pres'?'Kdo byl prezidentem dřív?':'Co bylo dřív?',a:[first.n,second.n],x:`Nejdřív: ${first.n} (${first.y}). Potom: ${second.n} (${second.y}).`}); }
  // nejdéle
  const withD=it.filter(z=>z.d); if(withD.length>=3){ const c=shuffle(withD).slice(0,Math.min(4,withD.length)); const best=c.reduce((m,z)=>z.d>m.d?z:m); if(c.filter(z=>z.d===best.d).length===1) out.push({q:K==='pres'?'Kdo z nich byl prezidentem nejdéle?':'Kdo z nich vládl nejdéle?',a:[best.n,...c.filter(z=>z!==best).map(z=>z.n)],x:c.map(z=>`${z.n}: ${yrs(z.d)}`).join(', ')+'.'}); }
  return out;
}
function buildQuiz(e){
  const st=shuffle(e.qs).slice(0,4), gen=shuffle(genQs(e));
  const seen=new Set(); const g=[]; for(const q of gen){ if(seen.has(q.q)) continue; seen.add(q.q); g.push(q); if(g.length>=3) break; }
  const list=shuffle(st.slice(0,6-g.length).concat(g));
  return list;
}

function pexPool(e){
  const it=parseItems(e), pool=[];
  it.forEach(x=>pool.push([x.n,x.y]));
  e.qs.forEach(q=>{ if(q.q.length<=70) pool.push([q.q,q.a[0]]); });
  return pool;
}
function pexBoard(){
  const P=UI.pex, pool=shuffle(pexPool(E())), pairs=[], used=new Set();
  for(const [a,b] of pool){ if(pairs.length>=6) break; if(used.has(a)||used.has(b)) continue; used.add(a); used.add(b); pairs.push([a,b]); }
  const cards=[]; pairs.forEach(([a,b],k)=>{ cards.push({k,t:a,side:0}); cards.push({k,t:b,side:1}); });
  P.cards=shuffle(cards).map(c=>({...c,done:false,bad:false})); P.sel=null; P.boardDone=false; P.n=pairs.length;
}
function openPex(){ if(!bonusOpen()) return lockToast();
  const e=E(); const others=shuffle(Object.keys(PIC).filter(k=>k!==e.id));
  UI.pex={board:0,pics:[e.id,...others].slice(0,6),wrong:0,fin:false,lock:false,earned:0};
  pexBoard(); UI.screen='pex'; render(); }
function pexTap(i){
  const P=UI.pex, c=P.cards[i]; if(P.lock||c.done||P.boardDone) return;
  if(P.sel===null){ P.sel=i; return render(); }
  if(P.sel===i){ P.sel=null; return render(); }
  const a=P.cards[P.sel];
  if(a.k===c.k&&a.side!==c.side){ a.done=c.done=true; P.sel=null;
    if(P.cards.every(x=>x.done)){ P.boardDone=true; P.earned+=reward(5);
      if(P.board>=5){ P.fin=true; const p=prog(E().id); P.earned+=reward(p.pex?5:20); p.pex=true; } save(); }
  } else { P.wrong++; a.bad=c.bad=true; P.lock=true; setTimeout(()=>{ a.bad=c.bad=false; P.sel=null; P.lock=false; render(); },700); }
  render();
}
function pexNext(){ const P=UI.pex; P.board++; pexBoard(); render(); }

// Pravda, nebo lež
function genTF(e){
  const it=parseItems(e), K=KIND[e.id]||'rulers', out=[];
  const V=x=>K==='pres'?'byl prezidentem':(x.f?'vládla':'vládl');
  it.forEach((x,k)=>{
    if(K==='rulers'||K==='pres'){
      out.push({t:`${x.n} ${V(x)} v letech ${x.y}.`,ok:true,x:`Ano, ${x.n}: ${x.y}.`});
      const o=shuffle(it.filter(z=>z!==x))[0]; if(o) out.push({t:`${x.n} ${V(x)} v letech ${o.y}.`,ok:false,x:`Ne. ${x.n}: ${x.y}. V letech ${o.y} ${V(o)} ${o.n}.`});
      if(x.d){ const w=x.d+shuffle([5,8,10,-5,15])[0]; if(w>0&&w!==x.d) out.push({t:`${x.n} ${V(x)} ${yrs(w)}.`,ok:false,x:`Ne, ${yrs(x.d)} (${x.y}).`}); }
    } else {
      out.push({t:`${x.n}: ${x.y}.`,ok:true,x:`Ano, ${x.n}: ${x.y}.`});
      const o=shuffle(it.filter(z=>z!==x))[0]; if(o) out.push({t:`${x.n}: ${o.y}.`,ok:false,x:`Ne. ${x.n}: ${x.y}.`});
    }
  });
  for(let t=0;t<4;t++){ const [a,b]=shuffle(it).slice(0,2); if(!a||!b) break; const tr=a.i<b.i;
    out.push({t:`${a.n} ${K==='rulers'||K==='pres'?'byl'+(a.f?'a':'')+' dřív než':'bylo dřív než'} ${b.n}.`,ok:tr,x:`${tr?'Ano':'Ne'}. ${a.n} (${a.y}), ${b.n} (${b.y}).`}); }
  out.push({t:`V době ${e.n} se platilo: ${e.cur[0]}.`,ok:true,x:e.coin});
  const oe=shuffle(ERAS.filter(z=>z.cur[0]!==e.cur[0]))[0]; out.push({t:`V době ${e.n} se platilo: ${oe.cur[0]}.`,ok:false,x:`Ne, platilo se: ${e.cur[0]}. ${oe.cur[0][0].toUpperCase()+oe.cur[0].slice(1)} patří do doby ${oe.n}.`});
  e.qs.forEach(q=>{ out.push({t:`${q.q} ${q.a[0]}.`,ok:true,x:q.x}); out.push({t:`${q.q} ${q.a[rnd(1,q.a.length-1)]}.`,ok:false,x:`Ne, správně je: ${q.a[0]}. ${q.x}`}); });
  return out;
}
function openTF(){ if(!bonusOpen()) return lockToast(); const all=shuffle(genTF(E())); const tr=all.filter(x=>x.ok).slice(0,4), fl=all.filter(x=>!x.ok).slice(0,4);
  UI.tf={list:shuffle(tr.concat(fl)),i:0,ok:0,ans:null}; UI.screen='tf'; render(); }
function tfAnswer(b){ const T=UI.tf; if(T.ans!==null) return; const it=T.list[T.i]; T.ans=b; if(b===it.ok){ T.ok++; T.gain=reward(5); T.right=true; } else { T.dmg=hurt(); T.right=false; } save(); render(); }
function tfNext(){ const T=UI.tf; T.i++; T.ans=null; if(T.i>=T.list.length){ T.done=true; if(T.ok>=6) prog(E().id).tf=true; } save(); render(); }

// Doplň, co chybí
function genBlanks(e){
  const out=[], caps=/[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][a-záčďéěíňóřšťúůýž]{3,}/g;
  const allCaps=[...new Set(e.facts.join(' ').match(caps)||[])];
  e.facts.forEach(f=>{
    const nums=[...f.matchAll(/\b\d{2,4}\b/g)];
    if(nums.length){ const m=shuffle(nums)[0], v=+m[0];
      const d=v>=100?[1,2,5,10,20,50]:[2,4,6,10];
      const opts=[...new Set(shuffle(d).flatMap(k=>[v+k,v-k]).filter(z=>z>0&&z!==v))].slice(0,3).map(String);
      if(opts.length===3) out.push({t:f.slice(0,m.index)+'_____'+f.slice(m.index+m[0].length),a:[m[0],...opts]}); }
    const ws=[...f.matchAll(caps)].filter(m=>m.index>0);
    if(ws.length){ const m=shuffle(ws)[0]; const d=shuffle(allCaps.filter(w=>!f.includes(w))).slice(0,3);
      if(d.length===3) out.push({t:f.slice(0,m.index)+'_____'+f.slice(m.index+m[0].length),a:[m[0],...d]}); }
  });
  return out;
}
function openBlank(){ if(!bonusOpen()) return lockToast(); const list=shuffle(genBlanks(E())).slice(0,5);
  UI.bl={list,i:0,ok:0,ans:null,opts:shuffle([0,1,2,3])}; UI.screen='blank'; render(); }
function blAnswer(j){ const B=UI.bl; if(B.ans!==null) return; B.ans=j; if(j===0){ B.ok++; B.gain=reward(5); } else B.dmg=hurt(); save(); render(); }
function blNext(){ const B=UI.bl; B.i++; B.ans=null; B.opts=shuffle([0,1,2,3]); if(B.i>=B.list.length){ B.done=true; if(B.ok>=3) prog(E().id).blank=true; } save(); render(); }

      <p class="big" style="font-weight:700;margin-top:8px">${esc(it.t)}</p>
      ${T.ans===null?`<div class="answers"><button class="ans tfy" onclick="tfAnswer(true)">✔ Pravda</button><button class="ans tfn" onclick="tfAnswer(false)">✘ Lež</button></div><div class="row" style="margin-top:14px"><button class="ghost" onclick="UI.screen='era';render()">Odejít</button></div>`
      :`<div class="fb ${T.right?'g':'b'}"><b>${T.right?`Správně! +${money(T.gain)}`:`Špatně, −${T.dmg} životů.`}</b> Je to ${it.ok?'pravda':'lež'}. ${esc(it.x)}</div><button class="primary" onclick="tfNext()">${T.i+1<T.list.length?'Další':'Výsledek'}</button>`}</div>`; }
  if(UI.screen==='blank'){ const B=UI.bl;
    if(!B.list.length) return `<div class="card"><h2>Doplň, co chybí</h2><p class="big">V této době není co doplňovat.</p><button class="primary" onclick="UI.screen='era';render()">Zpět</button></div>`;
    if(B.done) return `<div class="card"><h2>${B.ok>=3?'Výborně!':'Dobrý pokus'}</h2><p class="big">Správně ${B.ok} z ${B.list.length}.${B.ok>=3?'':' Na splnění potřebuješ aspoň 3.'}</p><div class="row"><button class="primary" onclick="openBlank()">Hrát znovu</button><button class="ghost" onclick="UI.screen='era';render()">Zpět do doby</button></div></div>`;
    const q=B.list[B.i];
    return `<div class="card ${UI.shake?'shake':''}"><div class="prog">${B.list.map((_,i)=>`<i class="${i<=B.i?'on':''}"></i>`).join('')}</div><p class="muted" style="margin:0">Doplň, co chybí. ${B.i+1} z ${B.list.length}</p>
      <p class="big" style="margin-top:8px">${esc(q.t).replace('_____','<span class="gap">'+(B.ans!==null?esc(q.a[0]):'?')+'</span>')}</p>
      <div class="answers">${B.opts.map(j=>`<button class="ans ${B.ans!==null?(j===0?'good':j===B.ans?'bad':''):''}" ${B.ans!==null?'disabled':''} onclick="blAnswer(${j})">${esc(q.a[j])}</button>`).join('')}</div>
      ${B.ans===null?`<div class="row" style="margin-top:14px"><button class="ghost" onclick="UI.screen='era';render()">Odejít</button></div>`:`<div class="fb ${B.ans===0?'g':'b'}"><b>${B.ans===0?`Správně! +${money(B.gain)}`:`Špatně, −${B.dmg} životů. Správně je: ${esc(q.a[0])}.`}</b></div><button class="primary" onclick="blNext()">${B.i+1<B.list.length?'Další':'Výsledek'}</button>`}</div>`; }
  return null;
}

/* ================= VYKRESLENÍ ================= */
function topbar(){
  const e=E();
  return `<div class="top">
    <div class="me">${avatar(S.look)}<b>${esc(S.name)}</b></div>
    <div class="hp"><div class="lbl">❤️ Životy ${S.hp}/${S.maxHp}</div><div class="track"><div class="fill" style="width:${S.hp/S.maxHp*100}%"></div></div></div>
    <div class="money ${UI.pop?'pop':''}">${coinSvg(e.c)} ${money(S.money)}</div>
    <button class="ghost" onclick="UI.screen='shop';render()">Tržiště</button>
    <button class="ghost" onclick="UI.screen='map';render()">Mapa dob</button>
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  if(!S||UI.screen==='create'){ UI.screen='create'; app.innerHTML=creator(); return; }
  document.documentElement.style.setProperty('--c',E().c);
  let m='';
  const e=E(), p=prog(e.id);
  if(UI.screen==='map'){
    m=`<h2 style="font-size:40px">Mapa dob</h2><p class="muted" style="margin:4px 0 0">Dokonči dobu, aby se ti otevřela další. Peníze se mění podle doby.</p>
    <div class="timeline">${ERAS.map((x,i)=>{const pp=S.prog[x.id]; const lock=i>S.unlocked; return `<button class="era ${i===S.era?'cur':''}" style="--c:${x.c}" ${lock?'disabled':''} onclick="goEra(${i})">
      ${coinSvg(x.c)}<div><div class="yr">${x.y}</div><h3>${x.n}</h3><div class="yr">Platidlo: ${x.cur[0]}</div></div>
      <span class="st">${lock?'🔒 zamčeno':pp&&pp.done?'✓ hotovo':i===S.era?'právě tady':'otevřeno'}</span></button>`;}).join('')}</div>`;
  }
  else if(UI.screen==='era'){
    const nF=e.facts.length+1;
    m=`<div class="band"><div class="yr">${e.y}</div><h2>${e.n}</h2><p>${e.intro}</p></div>
    <div class="cur-note">${coinSvg(e.c)}<div><b>Platidlo: ${e.cur[0]}</b><br>${e.coin}</div></div>
    <div class="tasks">
      <button class="task ${p.facts>=nF?'done':''} ${factsLocked()?'locked':''}" onclick="openFacts()"><span class="ic">${factsLocked()?'🔒':'📜'}</span><h3>Zajímavosti</h3><span class="muted">${factsLocked()?'Přečteno. Zamčeno, dokud nezvládneš otázky, takže si odpovědi nemůžeš dohledat.':'Přečti si, co se v této době dělo. Po přečtení se zamknou.'}</span><span class="s">${p.facts>=nF?(factsLocked()?'✓ přečteno, zamčeno':'✓ přečteno, můžeš číst znovu'):`${p.facts} z ${nF}`}</span></button>
      <button class="task ${p.order?'done':''}" onclick="openOrder()"><span class="ic">👑</span><h3>${e.order.t}</h3><span class="muted">Poskládej je ve správném pořadí.</span><span class="s">${p.order?'✓ hotovo':'odměna 15, pokaždé jinak'}</span></button>
      <button class="task ${p.quiz?'done':''}" onclick="openQuiz()"><span class="ic">❓</span><h3>Otázky</h3><span class="muted">Vyber správnou odpověď. Za chybu přijdeš o životy.</span><span class="s">${p.quiz?'✓ splněno':'6 otázek, pokaždé jiné'}</span></button>
      ${[['pex','🃏','Pexeso','Spoj kartičky, které patří k sobě, a odkryj 6 obrázků.','5 za obrázek + 20'],['tf','⚖️','Pravda, nebo lež?','Rozhodni, jestli věta platí.','5 za každou'],['blank','✏️','Doplň, co chybí','Doplň chybějící slovo nebo rok do věty.','5 za každou']].map(([k,ic,n,d,r])=>{const lk=!p.quiz,dn=p[k];return `<button class="task bonus ${dn?'done':''} ${lk?'locked':''}" onclick="${k==='pex'?'openPex':k==='tf'?'openTF':'openBlank'}()"><span class="ic">${lk?'🔒':ic}</span><h3>${n}</h3><span class="muted">${lk?'Bonus. Otevře se, až zvládneš otázky.':d}</span><span class="s">${dn?'✓ splněno, hraj znovu':lk?'zamčeno':'bonus, '+r}</span></button>`;}).join('')}
    </div>
    ${p.done&&S.era<ERAS.length-1?`<div class="row" style="margin-top:20px"><button class="primary" onclick="goEra(${S.era+1})">Pokračovat do další doby: ${ERAS[S.era+1].n}</button></div>`:''}
    ${S.era===ERAS.length-1&&!p.done?`<div class="cur-note" style="border-style:solid;margin-top:18px"><span style="font-size:40px">🏆</span><div><b>Tohle je poslední doba!</b><br>Když ji dokončíš, čeká tě velká výhra.</div></div>`:''}
    <p class="muted" style="margin-top:18px;font-size:16px">Tip: nejdřív si pořádně přečti zajímavosti. Po přečtení se zamknou a otevřou se znovu, až zvládneš otázky.</p>`;
  }
  else if(UI.screen==='facts'){
    const n=e.facts.length+1, last=UI.fi>=e.facts.length;
    const K=KIND[e.id]||'rulers', its=parseItems(e);
    m=`<div class="card"><div class="prog">${Array.from({length:n},(_,i)=>`<i class="${i<=UI.fi?'on':''}"></i>`).join('')}</div>
      ${last?`<h2>${K==='rulers'?'Přehled: kdo kdy vládl':K==='pres'?'Přehled prezidentů':K==='events'?'Přehled událostí':'Přehled dob'}</h2><p class="muted" style="margin-top:0">Tohle se ti bude hodit v otázkách i při řazení. Dobře si to prohlédni.</p>
        <div class="slots">${its.map((x,k)=>`<div class="slot full"><span class="n">${k+1}.</span><span><b>${x.n}</b></span><span class="y">${x.y}${x.d?` · ${yrs(x.d)}`:''}</span></div>`).join('')}</div>`
      :`<h2>Víš, že…?</h2><p class="big">${e.facts[UI.fi]}</p>`}
      <div class="row"><button class="primary" onclick="nextFact()">${UI.fi+1<n?'Další zajímavost':'Hotovo'}</button><button class="ghost" onclick="UI.screen='era';render()">Zpět</button></div></div>`;
  }
  else if(UI.screen==='order'){
    const o=UI.ord, it=e.order.items;
    m=`<div class="card ${UI.shake?'shake':''}"><h2>${e.order.t}</h2><p class="fb g" style="margin:6px 0 10px;font-weight:800">${o.rev?'⬆ Pozor, tentokrát od nejnovějšího po nejstarší!':'⬇ Od nejstaršího po nejnovější.'}</p><p class="muted" style="margin:0 0 14px">Klikej na jména dole. Kliknutím na řádek ho vrátíš zpět.</p>
      <div class="slots">${o.slots.map((v,k)=>`<button class="slot ${v!==null?'full':''} ${o.checked?(v===o.target[k]?'ok':'no'):''}" onclick="unSlot(${k})"><span class="n">${k+1}.</span><span>${v!==null?it[v].n:'…'}</span>${o.checked&&v!==null?`<span class="y">${it[v].y} ${v===o.target[k]?'✓':'✗'}</span>`:''}</button>`).join('')}</div>
      ${!o.checked?`<div class="pool">${o.pool.map(i=>`<button onclick="pickPool(${i})">${it[i].n}</button>`).join('')}</div>
      <div class="row"><button class="primary" ${o.slots.includes(null)?'disabled':''} onclick="checkOrder()">Zkontrolovat</button><button class="ghost" onclick="UI.screen='era';render()">Zpět</button></div>`
      :`<div class="fb ${o.okAll?'g':'b'}">${o.msg}</div>
      ${!o.okAll?`<p><b>Správné pořadí:</b> ${o.target.map(i=>`${it[i].n} (${it[i].y})`).join(', ')}</p>`:''}
      <div class="row">${o.okAll?`<button class="primary" onclick="UI.screen='era';checkEraDone();save();render()">Pokračovat</button>`:`<button class="primary" onclick="openOrder()">Zkusit znovu</button><button class="ghost" onclick="UI.screen='era';render()">Zpět</button>`}</div>`}
    </div>`;
  }
  else if(UI.screen==='quiz'){
    const Q=UI.q;
    if(Q.done){
      m=`<div class="card"><h2>${Q.pass?'Otázky zvládnuty!':'Ještě to nebylo ono'}</h2>
      <p class="big">Správně jsi odpověděl na ${Q.ok} z ${Q.list.length} otázek. ${Q.pass?'Úkol je splněný.':`Potřebuješ aspoň ${Q.need}. ${factsLocked()?'Zajímavosti jsou zamčené, tak si vzpomeň, co sis přečetl, a zkus to znovu. Dostaneš jiné otázky.':'Přečti si zajímavosti a zkus to ještě jednou.'}`}</p>
      <div class="row">${Q.pass?`<button class="primary" onclick="UI.screen='era';checkEraDone();save();render()">Pokračovat</button>`:`<button class="primary" onclick="openQuiz()">Zkusit znovu</button>${factsLocked()?'':`<button class="ghost" onclick="openFacts()">Číst zajímavosti</button>`}`}</div></div>`;
    } else {
      const q=Q.list[Q.i];
      m=`<div class="card ${UI.shake?'shake':''}"><div class="prog">${Q.list.map((_,i)=>`<i class="${i<=Q.i?'on':''}"></i>`).join('')}</div>
      <p class="muted" style="margin:0">Otázka ${Q.i+1} z ${Q.list.length}</p><h2>${q.q}</h2>
      <div class="answers">${Q.opts.map(j=>`<button class="ans ${Q.ans!==null?(j===0?'good':j===Q.ans?'bad':''):''} ${Q.hidden.includes(j)?'gone':''}" ${Q.ans!==null?'disabled':''} onclick="answer(${j})">${q.a[j]}</button>`).join('')}</div>
      ${Q.ans===null?`<div class="row" style="margin-top:16px"><button class="ghost" ${S.up.napoveda<1||Q.hidden.length||q.a.length<3?'disabled':''} onclick="useHint()">🦉 Nápověda (${S.up.napoveda})</button><button class="ghost" onclick="UI.screen='era';render()">Odejít</button></div>`
      :`<div class="fb ${Q.ans===0?'g':'b'}"><b>${Q.ans===0?`Správně! +${money(Q.gain)}`:(Q.dmg?`Špatně, −${Q.dmg} životů.`:'Špatně, ale amulet tě ochránil.')+` Správně je: ${q.a[0]}.`}</b><br>${q.x}</div>
      <button class="primary" onclick="nextQ()">${Q.i+1<Q.list.length?'Další otázka':'Výsledek'}</button>`}</div>`;
    }
  }
  else if(UI.screen==='shop'){ m=shopView(e); }
  else if(['pex','tf','blank'].includes(UI.screen)){ m=bonusScreens(e); }
  else if(UI.screen==='faint'){
    const lost=Math.floor(S.money*.3);
    m=`<div class="card"><h2>Došly ti životy!</h2><p class="big">Omdlel jsi. Probudí tě bylinkářka a dá ti napít. ${lost?`Za péči si vezme ${money(lost)}.`:''}</p>
    <p class="muted">Příště si včas kup na tržišti obvaz, lektvar nebo elixír, doplníš si tím životy.</p>
    <button class="primary" onclick="S.money-=${lost};S.hp=Math.round(S.maxHp/2);UI.screen='era';save();render()">Vstát a pokračovat</button></div>`;
  }
  else if(UI.screen==='victory'){
    const cols=['#e0b43a','#a8322d','#2f6d8a','#3f7d4a','#b0436e','#c0582b'];
    const conf=Array.from({length:70},(_,i)=>`<i style="left:${rnd(0,100)}%;background:${cols[i%6]};animation-delay:${(Math.random()*3).toFixed(2)}s;animation-duration:${(3+Math.random()*3).toFixed(2)}s;transform:rotate(${rnd(0,360)}deg)"></i>`).join('');
    const worn={head:'koruna',back:'plast_k'};
    const d=new Date(); const date=`${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`;
    m=`<div class="confetti" aria-hidden="true">${conf}</div>
    <div class="win">
      <div class="trophy" aria-hidden="true"><svg viewBox="0 0 120 120"><path d="M34 14h52v26c0 20-12 34-26 34S34 60 34 40Z" fill="#e0b43a" stroke="#a37b1c" stroke-width="3"/><path d="M34 22H18c0 18 8 28 18 30M86 22h16c0 18-8 28-18 30" fill="none" stroke="#e0b43a" stroke-width="6"/><rect x="54" y="74" width="12" height="16" fill="#c9962e"/><rect x="38" y="90" width="44" height="12" rx="3" fill="#7a5533"/><path d="M60 28l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="#fff5d6"/></svg></div>
      <h2 class="wintitle">Vyhrál jsi!</h2>
      <p class="big" style="margin:0 auto 20px">Prošel jsi celé české dějiny: od keltských duhovek až po dnešní koruny.</p>
      <div class="diploma">
        <div class="dav">${avatar(S.look,worn)}</div>
        <div>
          <div class="dl">Diplom</div>
          <h3>Znalec českých dějin</h3>
          <p>Uděluje se <b>${esc(S.name)}</b> za úspěšnou cestu všemi ${ERAS.length} dobami, od Keltů až po Českou republiku.</p>
          <div class="dstats"><span><b>${S.ok}</b> správných odpovědí</span><span><b>${ERAS.length}</b> dob</span><span><b>${money(S.money)}</b></span></div>
          <p class="muted" style="margin:10px 0 0;font-size:15px">Dne ${date}</p>
        </div>
      </div>
      <div class="row" style="justify-content:center;margin-top:22px"><button class="primary" onclick="UI.screen='map';render()">Mapa dob</button><button class="ghost" onclick="if(confirm('Začít celou cestu znovu?')){UI.look={...S.look};UI.name=S.name;wipe();S=null;UI.editing=false;UI.screen='create';render()}">Hrát znovu od začátku</button></div>
    </div>`;
  }
  else if(UI.screen==='eraDone'){
    const last=S.era>=ERAS.length-1;
    m=`<div class="card" style="text-align:center"><div style="display:flex;justify-content:center"><div style="width:160px">${avatar(S.look)}</div></div>
    <h2>Doba ${e.n} je hotová!</h2><p class="big" style="margin-inline:auto">Bonus za dokončení: ${money(50)}. ${last?'Prošel jsi celé české dějiny od Keltů až po dnešek. Jsi skutečný znalec!':`Otevřela se ti další doba: <b>${ERAS[S.era+1].n}</b>. Tam se platí ${ERAS[S.era+1].cur[0]}.`}</p>
    <div class="row" style="justify-content:center">${last?`<button class="primary" onclick="UI.screen='map';render()">Mapa dob</button>`:`<button class="primary" onclick="goEra(${S.era+1})">Cestovat do další doby</button><button class="ghost" onclick="UI.screen='shop';render()">Nejdřív na tržiště</button>`}</div></div>`;
  }
  app.innerHTML=topbar()+m+`${UI.toast?`<div class="toast" role="status">${esc(UI.toast)}</div>`:''}<div class="foot"><span>Hra se ukládá automaticky. Správně ${S.ok}, špatně ${S.bad}.</span><button onclick="if(confirm('Opravdu začít úplně od začátku?')){wipe();S=null;UI.editing=false;UI.screen='create';render()}">Nová hra</button></div>`;
  UI.shake=false; UI.pop=false; UI.healed=0;
}

function creator(){
  const L=UI.look, saved=load();
  const free=cat=>CATALOG.filter(x=>x.cat===cat&&x.p===0);
  const chips=cat=>free(cat).map(x=>`<button class="chip" aria-pressed="${L[cat]===x.id}" onclick="UI.look.${cat}='${x.id}';render()">${x.n}</button>`).join('');
  const sw=cat=>free(cat).map(x=>`<button class="sw" style="background:${x.v}" aria-label="${x.n}" aria-pressed="${L[cat]===x.id}" onclick="UI.look.${cat}='${x.id}';render()"></button>`).join('');
  const skin=SKIN.map((c,i)=>`<button class="sw" style="background:${c}" aria-label="Pleť ${i+1}" aria-pressed="${L.skin===i}" onclick="UI.look.skin=${i};render()"></button>`).join('');
  return `<div class="hero">
    <div class="stage">${avatar(L)}</div>
    <div>
      <h1 class="title">Cesta dějinami</h1>
      <p class="lead">Vyrob si postavičku a projdi české dějiny od Keltů až po dnešek. Za správné odpovědi dostaneš peníze a na tržišti si koupíš vylepšení a přes ${Math.floor(PAID/10)*10} kusů oblečení a výbavy.</p>
      ${saved?`<div class="row" style="margin-bottom:22px"><button class="primary" onclick="S=load();UI.screen='era';render()">Pokračovat za postavu ${esc(saved.name)}</button></div>`:''}
      <div class="opt"><h3>Jméno</h3><input type="text" maxlength="20" value="${esc(UI.name)}" placeholder="Jak se jmenuješ?" oninput="UI.name=this.value"></div>
      <div class="opt"><h3>Barva pleti</h3><div class="chips">${skin}</div></div>
      <div class="opt"><h3>Účes</h3><div class="chips">${chips('hair')}</div></div>
      <div class="opt"><h3>Barva vlasů</h3><div class="chips">${sw('hc')}</div></div>
      <div class="opt"><h3>Barva očí</h3><div class="chips">${sw('eyec')}</div></div>
      <div class="opt"><h3>Oblečení</h3><div class="chips">${chips('outfit')}</div></div>
      <div class="opt"><h3>Barva oblečení</h3><div class="chips">${sw('cloth')}</div></div>
      <p class="muted" style="font-size:15px">Další účesy, barvy, oblečení, pokrývky hlavy, zbraně i mazlíčky si koupíš na tržišti.</p>
      <div class="row" style="margin-top:14px"><button class="primary" onclick="start()">Vyrazit do dějin</button></div>
    </div></div>`;
}
render();
</script>
</body>
</html>
