<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Výprava na Bílou horu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;0,800;1,400&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: noční „stroj času" (mosazný přístroj nahoře) + pergamenová kronika uprostřed, jedna scéna = jedna kapitola. Záměrně jeden vzhled pro světlý i tmavý režim. */
:root{
  --night:#191a2f; --night-2:#262844; --brass:#c79a3b; --brass-hi:#f0cf7a;
  --parch:#f1e4c3; --parch-2:#e4d1a3; --edge:#b9955a; --ink:#2b1d12; --ink-soft:#5b4630;
  --blood:#9b2a22; --royal:#24427a; --ok:#2f6b3a; --glow:#7fe3d6;
  --display:"Grenze Gotisch","UnifrakturMaguntia",Georgia,serif;
  --body:"Alegreya",Georgia,"Times New Roman",serif;
  --ui:"Alegreya Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);background-image:radial-gradient(1200px 600px at 50% -10%,#34366a 0%,transparent 60%),radial-gradient(2px 2px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 12%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 40%,#fff5 50%,transparent 51%),radial-gradient(2px 2px at 40% 8%,#fff7 50%,transparent 51%);color:var(--parch);font-family:var(--body);font-size:18px;line-height:1.55;padding:0 16px;padding-block:0 48px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:3px}

/* ---------- přístroj nahoře ---------- */
.machine{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;max-width:980px;margin:0 auto;padding:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:linear-gradient(var(--night) 70%,transparent)}
.dial{display:flex;align-items:center;gap:10px;background:linear-gradient(#3a2a12,#20170a);border:2px solid var(--brass);border-radius:10px;padding:6px 12px;box-shadow:inset 0 0 12px #000a,0 0 18px #c79a3b33}
.dial small{font-family:var(--ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-hi)}
.year{font-family:var(--ui);font-weight:800;font-size:26px;letter-spacing:.08em;color:var(--glow);text-shadow:0 0 10px #7fe3d688;font-variant-numeric:tabular-nums;min-width:4ch}
.seals{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.seal{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#ffffff30;border:2px dashed #ffffff30;background:none;padding:0}.seal svg{width:16px;height:16px}.sealcount{font-family:var(--ui);font-weight:800;font-size:13px;color:var(--brass-hi);align-self:center;margin-right:4px}
.seal.got{background:radial-gradient(circle at 35% 30%,#d4473c,var(--blood) 60%,#5e1611);color:#f6d7a8;border:2px solid #6e1a14;box-shadow:0 2px 6px #0008;cursor:pointer}
.seal.got:hover{transform:scale(1.1)}
.sound{background:none;border:2px solid var(--brass);color:var(--brass-hi);border-radius:8px;padding:5px 10px;font-family:var(--ui);font-weight:700;font-size:14px}

/* ---------- kronika ---------- */
.book{max-width:980px;margin:8px auto 0;background:var(--parch);color:var(--ink);border-radius:6px;padding:28px clamp(16px,4vw,44px) 32px;box-shadow:0 0 0 2px var(--edge),0 0 0 8px #3b2b17,0 20px 60px #000c;background-image:radial-gradient(ellipse at 10% 0%,#fff6 0%,transparent 40%),radial-gradient(ellipse at 100% 100%,#c9a86655 0%,transparent 50%);position:relative}
.eyebrow{font-family:var(--ui);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--blood)}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.05;text-wrap:balance;margin:.15em 0 .35em;color:var(--ink)}
h1{font-size:clamp(40px,7vw,72px)}
h2{font-size:clamp(32px,5vw,50px)}
h3{font-family:var(--ui);font-weight:800;font-size:19px;margin:0 0 4px}
p{margin:0 0 .8em;max-width:68ch}
.lead{font-size:20px}
.drop::first-letter{font-family:var(--display);float:left;font-size:3.4em;line-height:.8;padding:6px 8px 0 0;color:var(--blood)}

.guide{display:flex;gap:14px;align-items:flex-start;background:var(--parch-2);border:1px solid var(--edge);border-radius:10px;padding:12px 14px;margin:14px 0}
.guide .face{flex:0 0 52px;height:52px}
.guide .say{min-width:0}
.guide .who{font-family:var(--ui);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:block}
.guide p{margin:0}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blood);color:#fbeacb;border:none;border-radius:8px;padding:12px 20px;font-family:var(--ui);font-weight:800;font-size:17px;box-shadow:0 3px 0 #5e1611;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5e1611}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink-soft);box-shadow:none}
.btn.brass{background:linear-gradient(#e2b958,#a67a24);color:#22170a;box-shadow:0 3px 0 #6b4d14}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

.fact{background:#fff8e6;border-left:5px solid var(--royal);border-radius:4px;padding:10px 14px;margin:10px 0;animation:pop .35s ease}
.fact.red{border-color:var(--blood)}
.fact.green{border-color:var(--ok)}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

.choices{display:grid;gap:10px;margin:12px 0}
.choice{text-align:left;background:#fffaf0;border:2px solid var(--edge);border-radius:10px;padding:12px 14px;color:var(--ink);font-family:var(--body);font-size:17px;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--blood);background:#fff}
.choice:disabled{cursor:default;opacity:.65}
.choice.right{border-color:var(--ok);background:#e3f1df;opacity:1}
.choice.wrong{border-color:var(--blood);background:#f6dcd6;opacity:1}
.choice b{font-family:var(--ui)}

.grid-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.item{background:#fffaf0;border:2px solid var(--edge);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-family:var(--ui);font-weight:700;font-size:15px;text-align:center}
.item svg{width:64px;height:64px}
.item.seen{border-color:var(--ok);background:#eef6e9}
.item:hover{border-color:var(--blood)}

.timeline{display:grid;gap:8px;margin:12px 0}
.ev{display:flex;gap:12px;align-items:center;text-align:left;background:#fffaf0;border:2px solid var(--edge);border-radius:10px;padding:10px 14px;color:var(--ink);font-family:var(--body);font-size:17px}
.ev .n{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--ui);font-weight:800;background:var(--parch-2);color:var(--ink-soft)}
.ev.done{border-color:var(--ok);background:#eef6e9}
.ev.done .n{background:var(--ok);color:#fff}
.ev.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.scene-wrap{border:3px solid #3b2b17;border-radius:8px;overflow:hidden;background:#222;margin:12px 0;position:relative}
.scene-wrap svg{display:block;width:100%;height:auto}
.hint{font-family:var(--ui);font-weight:700;font-size:15px;color:var(--ink-soft)}

/* defenestrace */
.fig{cursor:pointer;transform-box:fill-box;transform-origin:center}
.fig:hover .hl{opacity:1}
.fig .hl{opacity:0;transition:opacity .2s}
.fig.out{animation:fall 1.6s cubic-bezier(.45,0,.9,.6) forwards;cursor:default}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}18%{transform:translate(calc(var(--dx)*.25),-30px) rotate(70deg)}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.glass{opacity:0}
.glass.on{animation:glass .8s forwards}
@keyframes glass{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--gx),120px)}}

/* volba */
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.cand{background:#fffaf0;border:2px solid var(--edge);border-radius:12px;padding:14px;text-align:left;color:var(--ink);font-family:var(--body);font-size:16px;display:flex;flex-direction:column;gap:6px}
.cand .crest{width:56px;height:56px}
.cand:hover:not(:disabled){border-color:var(--blood)}
.cand.pick{border-color:var(--ok);background:#eef6e9}
.cand.nope{opacity:.6}
.tag{display:inline-block;font-family:var(--ui);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--parch-2);color:var(--ink-soft)}

/* bitva */
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:10px 0}
.bar label{font-family:var(--ui);font-weight:800;font-size:14px;display:flex;justify-content:space-between}
.bar .track{height:14px;background:#d8c59b;border-radius:8px;overflow:hidden;border:1px solid var(--edge)}
.bar .fill{height:100%;transition:width .9s ease}
.bar.st .fill{background:linear-gradient(90deg,#c0392b,#e8d7b0)}
.bar.ci .fill{background:linear-gradient(90deg,#1f1f1f,#e0b62e)}
.unit{transition:transform 1.6s ease-in-out}
.puff{animation:puff 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes puff{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(2.6) translateY(-8px)}}
.flash{animation:flash .25s forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.banner span{font-family:var(--display);font-size:clamp(34px,7vw,64px);color:#f5e6c4;background:#5e1611dd;padding:6px 24px;border:3px solid var(--brass);border-radius:6px;animation:pop .5s}
.log{font-size:16px;background:#fff8e6;border:1px solid var(--edge);border-radius:8px;padding:10px 14px;margin:10px 0}
.log p{margin:0 0 .4em}
.cannon-game{background:#2b2015;color:var(--parch);border-radius:10px;padding:14px;margin:10px 0}
.meter{position:relative;height:28px;background:linear-gradient(90deg,#7a2a22 0%,#a5762a 30%,#3f8b49 42%,#3f8b49 58%,#a5762a 70%,#7a2a22 100%);border-radius:6px;margin:10px 0;border:2px solid var(--brass)}
.needle{position:absolute;top:-6px;width:6px;height:36px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff;left:0}
.shots{font-family:var(--ui);font-weight:800}

/* po bitvě */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:14px 0}
.flip{perspective:900px;background:none;border:none;padding:0;min-height:190px;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .6s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.flip .f{background:linear-gradient(160deg,#3b2b17,#5a4220);color:#f3e2bd;border:2px solid var(--brass);justify-content:center;align-items:center;text-align:center}
.flip .f .big{font-family:var(--display);font-size:34px;color:var(--brass-hi);line-height:1}
.flip .f .hint2{font-family:var(--ui);font-size:13px;opacity:.75}
.flip .b{background:#fffaf0;color:var(--ink);border:2px solid var(--edge);transform:rotateY(180deg);font-size:15.5px;line-height:1.45;overflow:auto}

/* certifikát */
.cert{border:6px double var(--blood);padding:24px;text-align:center;background:#fffaf0;border-radius:4px;margin:16px 0}
.cert h2{margin:.2em 0}
.cert .name{font-family:var(--display);font-size:clamp(30px,6vw,46px);color:var(--royal)}
input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--edge);border-radius:8px;background:#fffaf0;color:var(--ink);width:min(320px,100%)}

/* přechod časem */
.warp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle,#0b0c1a 0%,#05060d 70%);opacity:0;pointer-events:none;transition:opacity .35s}
.warp.on{opacity:1;pointer-events:auto}
.warp .rings{position:absolute;width:min(90vmin,640px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,#7fe3d633 0 6deg,transparent 6deg 18deg),repeating-radial-gradient(circle,#c79a3b44 0 2px,transparent 2px 28px);animation:spin 2.2s linear infinite;max-width:100%}
@keyframes spin{to{transform:rotate(360deg)}}
.warp .ctr{position:relative;text-align:center;color:var(--parch)}
.warp .yy{font-family:var(--ui);font-weight:800;font-size:clamp(56px,14vw,120px);color:var(--glow);text-shadow:0 0 30px #7fe3d6;font-variant-numeric:tabular-nums}
.warp .lbl{font-family:var(--ui);letter-spacing:.2em;text-transform:uppercase;font-size:14px;color:var(--brass-hi)}
.warp .dest{font-family:var(--display);font-size:clamp(24px,5vw,36px)}

/* postavy – mluvící hlavy */
.cast{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:12px 0;padding:10px 12px;border:1px dashed var(--edge);border-radius:12px;background:#fff8e6}
.cast .lbl{flex:1 1 100%;font-family:var(--ui);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.cast .lock{display:none;color:var(--blood)}
.locked .cast .lock{display:inline}
.head{background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;align-self:flex-start;gap:2px;width:84px;color:var(--ink);font-family:var(--ui);font-weight:700;font-size:12.5px;line-height:1.15;text-align:center;transition:transform .15s,filter .2s}
.head svg{width:72px;height:80px;filter:drop-shadow(0 3px 3px #0004)}
.head:hover{transform:translateY(-3px) rotate(-2deg)}
.locked .head{filter:grayscale(1) opacity(.45);cursor:not-allowed}
.locked .head:hover{transform:none}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mouth-open{transform-box:fill-box;transform-origin:center top;transform:scaleY(.15)}
.talk .mouth-open{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.talk .bob{animation:bob .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes bob{50%{transform:rotate(2deg) translateY(-1px)}}
.speaker{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#0b0c1acc;padding:16px}
.speaker .box{max-width:640px;width:100%;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.speaker .big svg{width:min(190px,44vw);height:auto;filter:drop-shadow(0 8px 16px #000a)}
.speaker .bubble{position:relative;flex:1 1 280px;min-width:0;background:var(--parch);color:var(--ink);border:3px solid var(--edge);border-radius:18px;padding:16px 18px;font-size:18px;box-shadow:0 10px 30px #000a}
.speaker .bubble::before{content:"";position:absolute;left:-16px;bottom:30px;border:14px solid transparent;border-right-color:var(--edge)}
.speaker .bubble h3{font-family:var(--display);font-size:30px;font-weight:700;margin:0}
.speaker .bubble .role{font-family:var(--ui);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blood);margin-bottom:6px}
.speaker .typed{min-height:5em}
@media (max-width:560px){.speaker .bubble::before{display:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--blood);color:#fbeacb;font-family:var(--ui);font-weight:800;padding:10px 18px;border-radius:30px;box-shadow:0 6px 20px #0008;animation:pop .25s}

/* rady */
.hintbtn{background:#fff3d1;border:2px dashed var(--brass);color:var(--ink);border-radius:8px;padding:6px 12px;font-family:var(--ui);font-weight:800;font-size:14px}
.hinttxt{background:#fff3d1;border-left:5px solid var(--brass);border-radius:4px;padding:8px 12px;margin:8px 0;font-size:16px;animation:pop .3s}

/* obrázky k otázkám */
.ill{border:3px solid #3b2b17;border-radius:10px;overflow:hidden;margin:10px 0;max-width:520px;background:#222}
.ill svg{display:block;width:100%;height:auto}
.ill figcaption{background:#3b2b17;color:var(--parch);font-family:var(--ui);font-weight:700;font-size:13px;padding:4px 10px}
.fb{transform-box:fill-box}
.tw{animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.stamp{animation:stamp 2.4s ease-in infinite;transform-origin:center}
@keyframes stamp{0%{transform:translateY(-60px) scale(1.6);opacity:0}30%{opacity:1}45%,100%{transform:none;opacity:1}}
.tug{animation:tug 1.6s ease-in-out infinite alternate}
@keyframes tug{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.leanL{animation:leanL 1.6s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes leanL{from{transform:rotate(-8deg)}to{transform:rotate(4deg)}}
.leanR{animation:leanR 1.6s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes leanR{from{transform:rotate(-4deg)}to{transform:rotate(8deg)}}
.dropfig{animation:dropfig 2.8s cubic-bezier(.5,0,.9,.6) infinite;transform-origin:center}
@keyframes dropfig{0%,15%{transform:translate(0,0) rotate(0)}70%,100%{transform:translate(70px,92px) rotate(400deg)}}
.paper{animation:paper 2.2s ease-in infinite}
@keyframes paper{0%{transform:translate(0,-50px) rotate(-20deg);opacity:0}20%{opacity:1}80%{transform:translate(0,30px) rotate(10deg);opacity:1}100%{transform:translate(0,40px);opacity:0}}
.bobc{animation:bobc 2s ease-in-out infinite}
@keyframes bobc{50%{transform:translateY(-6px)}}
.swL{animation:swL .7s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes swL{from{transform:rotate(-55deg)}to{transform:rotate(10deg)}}
.swR{animation:swR .7s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes swR{from{transform:rotate(-10deg)}to{transform:rotate(55deg)}}
.spark{animation:spark .7s infinite alternate}
@keyframes spark{0%,60%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1.2)}}
.stepL{animation:stepL 1.4s ease-in-out infinite alternate}
@keyframes stepL{to{transform:translateX(10px)}}
.stepR{animation:stepR 1.4s ease-in-out infinite alternate}
@keyframes stepR{to{transform:translateX(-10px)}}
.fallen{animation:fallen 6s ease-in infinite;transform-origin:50% 100%}
@keyframes fallen{0%,25%{transform:rotate(0)}38%,100%{transform:rotate(-88deg)}}
.hitpuff{animation:hitpuff 6s infinite;transform-origin:center}
@keyframes hitpuff{0%,20%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1)}40%,100%{opacity:0;transform:scale(2)}}
.helm{animation:helm 6s infinite}
@keyframes helm{0%,30%{transform:translate(0,0) rotate(0)}48%,100%{transform:translate(-60px,38px) rotate(-300deg)}}
.memorial{animation:memorial 6s infinite}
@keyframes memorial{0%,60%{opacity:0}75%,100%{opacity:1}}
.flame{animation:flame .35s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes flame{from{transform:scaleY(.8) scaleX(1.05)}to{transform:scaleY(1.15) scaleX(.9)}}
.sharpen{animation:sharpen .5s ease-in-out infinite alternate}
@keyframes sharpen{to{transform:translateX(14px)}}
.mistband{animation:mistband 9s linear infinite}
@keyframes mistband{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
.recoil{animation:recoil 2.4s infinite}
@keyframes recoil{0%,8%{transform:translateX(0)}12%{transform:translateX(-12px)}30%,100%{transform:translateX(0)}}
.smk{animation:smk 2.4s infinite;transform-origin:center}
@keyframes smk{0%,8%{opacity:0;transform:scale(.3)}12%{opacity:.9}60%,100%{opacity:0;transform:scale(2.4) translateY(-10px)}}
.boomr{animation:boomr 2.4s infinite;transform-origin:center}
@keyframes boomr{0%,54%{opacity:0;transform:scale(.3)}58%{opacity:1}90%,100%{opacity:0;transform:scale(2)}}
.snow{animation:snow linear infinite}
@keyframes snow{from{transform:translateY(-20px)}to{transform:translateY(190px)}}
.ride{animation:ride 7s linear infinite}
@keyframes ride{from{transform:translateX(-140px)}to{transform:translateX(340px)}}
.wheel{animation:spin .6s linear infinite;transform-origin:center}
.cross{animation:crossin 9s infinite;opacity:0}
@keyframes crossin{0%{opacity:0}8%,90%{opacity:1}100%{opacity:0}}
.sand{animation:sand 4s linear infinite}
@keyframes sand{from{transform:scaleY(1)}to{transform:scaleY(.1)}}
.walk{animation:walk 10s linear infinite}
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(230px)}}

<script>
/* ================= ZVUK ================= */
let AC=null, soundOn=false, voiceOn=false;
const sBtn=document.getElementById('soundBtn'), vBtn=document.getElementById('voiceBtn');
function setSound(on){ soundOn=on; if(soundOn&&!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){soundOn=false}} if(AC&&AC.state==='suspended')AC.resume(); sBtn.textContent='Zvuky: '+(soundOn?'zap.':'vyp.'); sBtn.setAttribute('aria-pressed',soundOn); document.querySelectorAll('[data-sync=sound]').forEach(b=>{b.textContent=soundOn?'Zvuky jsou zapnuté':'Zapnout zvuky';b.setAttribute('aria-pressed',soundOn)}); if(soundOn) chime(); }
function setVoice(on){ voiceOn=on && ('speechSynthesis' in window); if(on&&!voiceOn) toast('Tvůj prohlížeč neumí mluvit nahlas. Text si přečti.'); if(!voiceOn){try{speechSynthesis.cancel()}catch(e){}} vBtn.textContent='Hlas postav: '+(voiceOn?'zap.':'vyp.'); vBtn.setAttribute('aria-pressed',voiceOn); document.querySelectorAll('[data-sync=voice]').forEach(b=>{b.textContent=voiceOn?'Hlas postav je zapnutý':'Zapnout hlas postav';b.setAttribute('aria-pressed',voiceOn)}); }
sBtn.onclick=()=>setSound(!soundOn);
vBtn.onclick=()=>setVoice(!voiceOn);
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
let csVoice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices(); csVoice=v.find(x=>/^cs/i.test(x.lang))||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){} }
function speak(text,pitch=1,rate=1,onend){ if(!voiceOn){ return false; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,'')); u.lang='cs-CZ'; if(csVoice)u.voice=csVoice; u.pitch=pitch; u.rate=rate; u.onend=onend; u.onerror=onend; speechSynthesis.speak(u); return true; }catch(e){ return false; } }
function noise(dur,freq,vol,type='lowpass'){ if(!soundOn||!AC)return; const n=AC.sampleRate*dur, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); const s=AC.createBufferSource(); s.buffer=buf; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=AC.createGain(); g.gain.value=vol; s.connect(f).connect(g).connect(AC.destination); s.start(); }
function tone(fr,dur,vol=.15,type='sine',when=0){ if(!soundOn||!AC)return; const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=fr; const t=AC.currentTime+when; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur); }
const boom=()=>{noise(1.1,180,1.2); tone(55,.6,.5,'sine')};
const crash=()=>{noise(.5,3500,.5,'highpass')};
const musket=()=>{noise(.25,900,.6)};
const thud=()=>{noise(.35,120,.9)};
const chime=()=>{tone(784,.5,.12,'triangle');tone(1046,.7,.1,'triangle',.12)};
const buzz=()=>{tone(140,.25,.15,'sawtooth')};
const drum=()=>{for(let i=0;i<6;i++){ if(soundOn&&AC) setTimeout(()=>noise(.12,250,.7),i*110)}};
const whoosh=()=>{noise(1.4,600,.35,'bandpass')};

/* ================= STAV ================= */
const CH=[
  {id:'rudolf', year:1609, name:'Dvůr Rudolfa II.', seal:'R'},
  {id:'matyas', year:1611, name:'Bratrský spor', seal:'M'},
  {id:'okno',   year:1618, name:'Pražská defenestrace', seal:'D'},
  {id:'volba',  year:1619, name:'Volba krále', seal:'F'},
  {id:'bitva',  year:1620, name:'Bitva na Bílé hoře', seal:'B'},
  {id:'po',     year:1621, name:'Po bitvě', seal:'P'},
];
let S={scene:'intro', seals:[], name:'', quizScore:0};
const $=s=>document.querySelector(s);
const stage=$('#stage');
function setYear(y){$('#year').textContent=y}
const SEAL_ICON={
 rudolf:'<path d="M3 15 L2 6 L6 9 L10 3 L14 9 L18 6 L17 15Z"/>',
 matyas:'<path d="M4 17 L10 3 M16 17 L10 3" stroke="currentColor" stroke-width="2.2" fill="none"/><circle cx="10" cy="3" r="2.2"/>',
 okno:'<path d="M5 2 H15 V12 H5Z M10 2 V12 M5 7 H15" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 13 l3 5 M9 14 l-1 4" stroke="currentColor" stroke-width="1.8"/>',
 volba:'<path d="M4 9 H16 V17 H4Z"/><path d="M8 3 H13 V9 H8Z" fill="none" stroke="currentColor" stroke-width="1.6"/>',
 bitva:'<path d="M3 3 L17 17 M17 3 L3 17" stroke="currentColor" stroke-width="2.4"/><path d="M2 14 l4 4 M18 14 l-4 4" stroke="currentColor" stroke-width="3"/>',

let typer=null;
function showSpeaker(id){
  const P=PEOPLE[id]; closeSpeaker();
  const d=document.createElement('div'); d.className='speaker'; d.id='speaker'; d.setAttribute('role','dialog'); d.setAttribute('aria-label',P.n);
  d.innerHTML=`<div class="box"><div class="big talk" id="spHead">${headSVG(P.L,1)}</div><div class="bubble"><div class="role">${P.r}</div><h3>${P.n}</h3><p class="typed" id="spText"></p><div class="row" style="margin-top:6px"><button class="btn" id="spClose">Děkuji, můžeš jít</button>${'speechSynthesis' in window?`<button class="btn ghost" id="spVoice">${voiceOn?'Hlas: zap.':'Pustit nahlas'}</button>`:''}</div></div></div>`;
  document.body.appendChild(d);
  const el=$('#spText'); let i=0; const txt=P.t;
  let speaking=speak(txt,P.p,1,()=>{ const h=$('#spHead'); if(h) h.classList.remove('talk'); });
  typer=setInterval(()=>{ i+=2; el.textContent=txt.slice(0,i); if(i>=txt.length){ clearInterval(typer); if(!speaking){ const h=$('#spHead'); if(h) h.classList.remove('talk'); } } },38);
  $('#spClose').onclick=closeSpeaker; $('#spClose').focus();
  const vb=$('#spVoice'); if(vb) vb.onclick=()=>{ if(!voiceOn) setVoice(true); if(voiceOn){ $('#spHead').classList.add('talk'); speaking=speak(txt,P.p,1,()=>{ const h=$('#spHead'); if(h) h.classList.remove('talk'); }); vb.textContent='Hlas: zap.'; } };
  d.onclick=e=>{ if(e.target===d) closeSpeaker(); };
  tone(330,.15,.08,'triangle');
}
function closeSpeaker(){ clearInterval(typer); try{speechSynthesis.cancel()}catch(e){} const d=$('#speaker'); if(d) d.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSpeaker(); });
document.addEventListener('click',e=>{ const h=e.target.closest('.head'); if(!h) return; if(LOCKS.size){ buzz(); toast('Nejdřív odpověz na otázku. Teď ti postavy neporadí!'); return; } showSpeaker(h.dataset.person); });

function gearPath(cx,cy,r,n){ let d=''; for(let i=0;i<n*2;i++){ const a1=i*Math.PI/n, a2=(i+1)*Math.PI/n, rr=i%2?r:r+5; d+=(i?'L':'M')+(cx+rr*Math.cos(a1)).toFixed(1)+' '+(cy+rr*Math.sin(a1)).toFixed(1)+' L'+(cx+rr*Math.cos(a2)).toFixed(1)+' '+(cy+rr*Math.sin(a2)).toFixed(1)+' '; } return d+'Z'; }

function flipDigits(y){ return String(y).padStart(4,'0').split('').map(d=>`<span class="fd">${d}</span>`).join(''); }
function setFlip(y){ const el=$('#flipY'); if(!el) return; const s=String(y).padStart(4,'0'); const ds=el.querySelectorAll('.fd'); s.split('').forEach((d,i)=>{ if(ds[i] && ds[i].textContent!==d){ ds[i].textContent=d; ds[i].classList.remove('fdflip'); void ds[i].offsetWidth; ds[i].classList.add('fdflip'); } }); }
let traveling=false;
function travel(scene){
  if(traveling) return; traveling=true; closeSpeaker(); closeDetail();
  const ch=CH.find(c=>c.id===scene);
  const target= ch? ch.year : 2026;
  const from=+$('#year').textContent;
  const w=$('#warp');
  w.innerHTML=`<div class="rings"></div><div class="ctr"><div class="lbl">Stroj času · cesta do roku</div><div class="mwrap">${machineSVG(true)}</div><div class="flipyear" id="flipY">${flipDigits(from)}</div><div class="dest">${ch? ch.name : (scene==='zkouska'?'Zpět do přítomnosti':'Do přítomnosti')}</div></div>`;
  w.classList.add('on');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T_IN=reduce?10:650, T_TURN=reduce?300:1900, T_OUT=reduce?10:500, R=44, PX=310, PY=166;
  const hand=$('#mHand'), crank=$('#mCrank'), hh=$('#mHandH'), mh=$('#mHandM'), my=$('#mYear');
  const dir= target>=from?1:-1, turns=3;
  const knob=a=>[PX+R*Math.cos(a), PY+R*Math.sin(a)];
  let lastQ=0; const t0=performance.now();
  const lerp=(a,b,k)=>a+(b-a)*k, ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  function step(t){
    const e=t-t0;
    if(e<T_IN){ const k=ease(e/T_IN), [kx,ky]=knob(0); hand.setAttribute('transform',`translate(${lerp(560,kx,k)} ${lerp(360,ky,k)})`); }
    else if(e<T_IN+T_TURN){ const k=ease((e-T_IN)/T_TURN), ang=dir*k*turns*2*Math.PI, [kx,ky]=knob(ang);
      crank.style.transform=`rotate(${ang*180/Math.PI}deg)`; hand.setAttribute('transform',`translate(${kx} ${ky})`);
      hh.style.transform=`rotate(${ang*180/Math.PI*2}deg)`; mh.style.transform=`rotate(${ang*180/Math.PI*12}deg)`;
      const y=Math.round(from+(target-from)*k); setYear(y); setFlip(y); my.textContent=y;
      const q=Math.floor(k*turns*4); if(q!==lastQ){ lastQ=q; tone(1400,.03,.05,'square'); }
      if(e-T_IN<20) whoosh(); }
    else if(e<T_IN+T_TURN+T_OUT){ const k=ease((e-T_IN-T_TURN)/T_OUT), [kx,ky]=knob(dir*turns*2*Math.PI); hand.setAttribute('transform',`translate(${lerp(kx,560,k)} ${lerp(ky,360,k)})`); setYear(target); setFlip(target); my.textContent=target; }
    else { chime(); setTimeout(()=>{ go(scene); w.classList.remove('on'); traveling=false; },250); return; }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

let wkRun=0;
async function runWinter(){
  const my=++wkRun, svg=$('#wk'); if(!svg) return;
  const sl=ms=>new Promise(r=>setTimeout(r,ms)), alive=()=>my===wkRun && document.getElementById('wk');
  const el=id=>document.getElementById(id);
  const A=(id,kf,o)=>{ const e=el(id); if(!e) return; e.getAnimations().forEach(a=>a.cancel()); return e.animate(kf,Object.assign({fill:'forwards'},o)); };
  const show=(id,on)=>{ const e=el(id); if(e) e.classList.toggle('on',on); };
  ['bMsg','bF1','bServ','bF2'].forEach(b=>show(b,false));
  el('wkEnd').setAttribute('opacity',0); el('wkSnow').setAttribute('opacity',0); el('wkLoad').innerHTML='';
  A('wkCar',[{transform:'translate(470px,300px)'}],{duration:1}); A('wkF',[{transform:'translate(250px,300px)',opacity:1}],{duration:1}); A('wkCrown',[{transform:'translate(250px,165px)'}],{duration:1}); A('wkChick',[{transform:'none',opacity:1}],{duration:1});
  svg.classList.remove('carGo','fRun','msgRun'); el('wkGarter').style.opacity=0;
  // 1. posel přibíhá
  svg.classList.add('msgRun'); drum();
  A('wkMsg',[{transform:'translate(-80px,300px)'},{transform:'translate(120px,300px)'}],{duration:1400,easing:'ease-out'});
  await sl(1400); if(!alive())return; svg.classList.remove('msgRun'); show('bMsg',true); tone(500,.2,.12,'square'); await sl(1500); if(!alive())return;
  // 2. Fridrich vyskočí, kuře padá
  show('bMsg',false); show('bF1',true);
  A('wkFin',[{transform:'translateY(0)'},{transform:'translateY(-46px)'},{transform:'translateY(0)'}],{duration:500,easing:'ease-out',fill:'none'});
  A('wkCrown',[{transform:'translate(250px,165px)'},{transform:'translate(250px,105px) rotate(-20deg)'},{transform:'translate(250px,165px)'}],{duration:500,fill:'forwards'});
  A('wkChick',[{transform:'none'},{transform:'translate(30px,60px) rotate(200deg)',opacity:1}],{duration:700,easing:'ease-in'});
  tone(900,.12,.12,'triangle'); tone(1300,.15,.1,'triangle',.08); await sl(1600); if(!alive())return;
  // 3. sluhové házejí truhly a malého prince do kočáru
  show('bF1',false);
  for(const [i,id] of [[0,'wkChest0'],[1,'wkChest1']]){ A(id,[{transform:'translate(150px,240px) rotate(0)',opacity:1},{transform:`translate(${300+i*40}px,${120-i*10}px) rotate(180deg)`,opacity:1},{transform:`translate(${450+i*30}px,${214-i*4}px) rotate(360deg)`,opacity:1}],{duration:900,easing:'ease-in-out'}); thud(); await sl(450); }
  await sl(500); if(!alive())return;
  el('wkLoad').innerHTML=chest(-20,-82)+chest(8,-84,'#5a3a20'); el('wkChest0').style.opacity=0; ['wkChest0','wkChest1'].forEach(id=>el(id).getAnimations().forEach(a=>a.cancel()));
  show('bServ',true);
  A('wkBaby',[{transform:'translate(150px,240px) rotate(0)',opacity:1},{transform:'translate(330px,90px) rotate(360deg)',opacity:1},{transform:'translate(470px,230px) rotate(720deg)',opacity:1},{transform:'translate(470px,230px)',opacity:0}],{duration:1500,easing:'ease-in-out'});
  tone(700,.3,.08,'sine'); tone(900,.3,.08,'sine',.3); await sl(1900); if(!alive())return;
  // 4. Fridrich utíká, koruna mu spadne
  show('bServ',false); svg.classList.add('fRun'); whoosh();
  A('wkF',[{transform:'translate(250px,300px)'},{transform:'translate(440px,300px)'}],{duration:1500,easing:'linear'});
  A('wkCrown',[{transform:'translate(250px,165px)',offset:0},{transform:'translate(330px,165px)',offset:.42},{transform:'translate(320px,105px) rotate(-60deg)',offset:.55},{transform:'translate(290px,292px) rotate(-260deg)',offset:.8},{transform:'translate(220px,292px) rotate(-560deg)',offset:1}],{duration:2600,easing:'linear'});
  setTimeout(()=>{ tone(800,.12,.15,'triangle'); tone(400,.3,.12,'triangle',.1); el('wkGarter').animate([{transform:'translate(360px,240px)',opacity:1},{transform:'translate(340px,296px) rotate(90deg)',opacity:1}],{duration:700,fill:'forwards',easing:'ease-in'}); },1000);
  await sl(1200); if(!alive())return; show('bF2',true); await sl(1500); if(!alive())return;
  // 5. skok do kočáru a pryč do Vratislavi
  show('bF2',false); svg.classList.remove('fRun');
  A('wkF',[{transform:'translate(440px,300px) scale(1)',opacity:1},{transform:'translate(465px,240px) scale(.6)',opacity:0}],{duration:450,easing:'ease-in'});
  await sl(500); if(!alive())return;

  A('wkCar',[{transform:'translate(470px,300px)'},{transform:'translate(520px,300px)',offset:.2},{transform:'translate(1000px,300px)'}],{duration:2600,easing:'ease-in'});

  el('wkEnd').setAttribute('opacity',1); el('wkEnd').animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:600}); chime();
  const b=el('wkPlay'); if(b) b.textContent='Pustit znovu';
}

  function flash(x,y){ const ns='http://www.w3.org/2000/svg'; const c=document.createElementNS(ns,'circle'); c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',6);c.setAttribute('fill','#ffd34d');c.setAttribute('class','flash'); fx.appendChild(c); setTimeout(()=>c.remove(),300); }
  function ball(x1,y1,x2,y2,cb){ const ns='http://www.w3.org/2000/svg'; const b=document.createElementNS(ns,'circle'); b.setAttribute('r',3.5); b.setAttribute('fill','#111'); fx.appendChild(b); const t0=performance.now(), d=700; boom(); flash(x1,y1); puff(x1,y1,12);
    (function st(t){ const k=Math.min(1,(t-t0)/d); const x=x1+(x2-x1)*k, y=y1+(y2-y1)*k-Math.sin(Math.PI*k)*70; b.setAttribute('cx',x); b.setAttribute('cy',y); if(k<1) requestAnimationFrame(st); else { b.remove(); puff(x2,y2,14,'#a8916a'); thud(); cb&&cb(); } })(t0); }
  function volley(xs,y,n=6){ for(let i=0;i<n;i++) setTimeout(()=>{ const x=xs+Math.random()*50; flash(x,y); puff(x,y-4,6); musket(); },i*120); }
  function banner(t){ const b=$('#banner'); b.querySelector('span').textContent=t; b.hidden=false; setTimeout(()=>b.hidden=true,1800); }
  const panel=$('#panel');

  const PH=[
    {t:'Ráno · mlha nad kopcem', img:'camp', cap:'Co dělají vojáci, než začne bitva',
     txt:`Je chladné listopadové ráno. Nad Bílou horou leží hustá mlha. Stavovské vojsko stojí nahoře na kopci. Vojáci jsou unavení a hladoví a mnoho z nich <b>už měsíce nedostalo žold</b> (výplatu). Dole u potoka se objevují první oddíly nepřítele. Císařských a ligistů je víc, <b>asi 28 000 mužů</b>.`,
     q:'Co nařídíš svým vojákům?',
     o:[{t:'Kopat valy a šance na obranu',r:'Vojáci kopou, ale zem je zmrzlá a času málo. Opevnění <b>nestihnou dokončit</b>. Tak to opravdu bylo.',st:-2,ci:-3},
        {t:'Poslat zvědy dolů k potoku',r:'Zvědové se vrací: „Jsou jich tisíce a jdou přímo na nás!“ Aspoň víte, kudy nepřítel přijde.',st:0,ci:-2},
        {t:'Nechat vojáky odpočívat u ohňů',r:'Vojáci se trochu zahřejí, ale nepřítel mezitím v klidu překročí potok.',st:-3,ci:0}],
     anim:()=>{ $('#mist').style.opacity='.15'; move('c1',190,300); move('c2',260,312); move('c3',230,338); move('cc',150,330); drum(); }},
    {t:'Poledne · útok do kopce',
     txt:`Mlha se zvedla. Císařští a ligisté překročili potok a <b>stoupají do kopce</b>. Je čas na děla! <b>Zastav ukazatel v zeleném poli</b> a vystřel. Máš tři rány.`,
     cannon:true,
     anim:()=>{ move('c1',300,282); move('c2',360,266); move('c3',330,300); }},
    {t:'Protiútok jízdy', img:'duel', cap:'Muž proti muži',
     txt:`Nepřátelská pěchota je už blízko. Jezdci mladého <b>Kristiána z Anhaltu</b> (syna velitele) se třesou nedočkavostí.`,
     q:'Pošleš jízdu do protiútoku?',
     o:[{t:'Ano! Jízda, vpřed!',r:'Jezdci se řítí z kopce a <b>zatlačí nepřítele zpátky</b>, ukořistí i prapory! Tohle se v bitvě opravdu stalo. Jenže zbytek vojska jim nepřijde na pomoc. Mladý Anhalt je zraněn a zajat.',st:-6,ci:-10,charge:true},
        {t:'Ne, budeme se bránit na kopci',r:'Vojáci stojí a střílejí. Nepřítel ale postupuje dál a dál. Historicky jízda vyrazila a na chvíli zvítězila.',st:-8,ci:-4}],
     anim:()=>{}},
    {t:'Zlom bitvy', img:'clash', cap:'Řady vojáků do sebe narážejí',
     txt:`Najednou se ozve křik. <b>Uherští jezdci</b>, spojenci stavů, se obrátili a <b>prchají</b>. Nezaplacení žoldnéři hází zbraně na zem a utíkají za nimi. Kristián z Anhaltu marně volá, ať vydrží.`,
     q:'Co uděláš?',
     o:[{t:'Zastavit prchající a vrátit je do boje',r:'Křičíš a máváš praporem, ale nikdo tě neposlouchá. Kdo nedostal výplatu, nechce umírat.',st:-30,ci:-3},
        {t:'Poslat pro krále Fridricha na hrad',r:'Posel cválá do Prahy. Král Fridrich zrovna obědvá na Pražském hradě. Než se vypraví ven, je skoro po všem.',st:-30,ci:-2}],
     anim:()=>{ move('sc',820,140); move('s3',830,180); move('c1',470,236); move('c2',520,222); move('cc',420,250); volley(470,236,8); }},
    {t:'Moravané u zdi obory Hvězda', img:'fallen', cap:'Mnoho vojáků už se domů nevrátí',
     txt:`Jen jeden oddíl ještě neutekl. <b>Moravský pluk</b> se postavil ke zdi obory Hvězda a bojuje dál, i když je obklíčený.`,
     q:'Jak se rozhodneš?',
     o:[{t:'Bojovat do posledního muže',r:'Moravané se statečně brání, ale jsou obklíčeni ze všech stran. Většina z nich padne. Dodnes se na ně vzpomíná jako na hrdiny Bílé hory.',st:-25,ci:-4},
        {t:'Ustoupit k Praze',r:'Cesta zpět už je zablokovaná nepřítelem. Jen pár vojáků se dostane do města.',st:-25,ci:-2}],
     anim:()=>{ move('c3',640,190); move('cc',740,186); move('c2',600,210); volley(640,186,10); move('s1',820,190); move('s2',840,196); }},
  ];

  function runPhase(){
    const P=PH[B.phase];
    P.anim();
    panel.innerHTML=`<div class="log"><div class="eyebrow">Fáze ${B.phase+1} z ${PH.length} · ${P.t}</div><div class="logrow"><p>${P.txt}</p>${P.img?illus(P.img,P.cap):''}</div></div><div id="act"></div>`; panel.scrollIntoView({behavior:'smooth',block:'nearest'});
    const act=$('#act');
    if(P.cannon){ cannonGame(act); return; }
    act.innerHTML=`<p><b>${P.q}</b></p><div class="choices">${P.o.map((o,i)=>`<button class="choice" data-i="${i}">${o.t}</button>`).join('')}</div>`;
    act.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ const o=P.o[+b.dataset.i]; act.querySelectorAll('.choice').forEach(x=>x.disabled=true); b.classList.add('right');
      if(o.charge){ move('sc',380,262); setTimeout(()=>{ for(let i=0;i<4;i++) setTimeout(()=>{puff(390+i*15,270,8); musket();},i*150); move('c1',230,300); move('c2',290,300); },1600); setTimeout(()=>move('sc',600,236),3300); }
      else volley(530,224,6);
      B.st+=o.st; B.ci+=o.ci; setTimeout(setBars,600);
      act.insertAdjacentHTML('beforeend',`<div class="fact ${o.st<-15?'red':''}">${o.r}</div><div class="row"><button class="btn" id="nxp">${B.phase<PH.length-1?'Pokračovat v bitvě':'Konec bitvy'}</button></div>`);
      $('#nxp').onclick=()=>{ B.phase++; if(B.phase<PH.length) runPhase(); else end(); };
    });
  }

  function cannonGame(act){
    let shots=3, hits=0, pos=0, dir=1, raf, busy=false;
    act.innerHTML=`<div class="cannon-game"><div class="shots" id="sh">Zbývající rány: 3 · Zásahy: 0</div><div class="meter"><div class="needle" id="nd"></div></div><div class="row" style="margin-top:6px"><button class="btn brass" id="fire">PAL!</button><span style="font-family:var(--ui);font-size:14px">Mezerník funguje taky.</span></div></div><div id="cres"></div>`;
    const nd=$('#nd'), meter=act.querySelector('.meter');
    function loop(){ pos+=dir*1.6; if(pos>=100){pos=100;dir=-1} if(pos<=0){pos=0;dir=1} nd.style.left=`calc(${pos}% - 3px)`; raf=requestAnimationFrame(loop); }
    loop();
    const fire=()=>{ if(busy||shots<=0)return; busy=true; const p=pos; const hit=p>=40&&p<=60; const near=p>=28&&p<=72; shots--;
      const tx= hit? 330+Math.random()*40 : near? 270+Math.random()*30 : 200+Math.random()*60; const ty= hit? 290: 330;
      ball(520,218,tx,ty,()=>{ if(hit){hits++; B.ci-=6;} else if(near){B.ci-=2;} setBars(); $('#sh').textContent=`Zbývající rány: ${shots} · Zásahy: ${hits}`; busy=false; if(shots===0) done(); });
    };
    $('#fire').onclick=fire;
    const key=e=>{ if(e.code==='Space'&&document.getElementById('fire')){ e.preventDefault(); fire(); } };
    document.addEventListener('keydown',key);
    function done(){ cancelAnimationFrame(raf); document.removeEventListener('keydown',key); $('#fire').disabled=true;
      setTimeout(()=>{ // nepřátelská odpověď
        ball(330,288,560,206); setTimeout(()=>ball(360,272,620,200),500); B.st-=8; setTimeout(setBars,1200);
        $('#cres').innerHTML=`<div class="fact">${hits>=2?'Výborná muška! Tvá děla zasáhla nepřátelské řady.':hits===1?'Jeden zásah! Nepřítel ale pořád postupuje.':'Koule letěly vedle. Děla tehdy nebyla moc přesná, nic si z toho nedělej.'} Stavovských děl bylo ale <b>málo</b> a nepřátelská děla začala odpovídat.</div><div class="row"><button class="btn" id="nxp">Pokračovat v bitvě</button></div>`;
        $('#nxp').onclick=()=>{ B.phase++; runPhase(); };
      },400);
    }
  }

  function end(){
    B.st=Math.min(B.st,6); setBars(); banner('PORÁŽKA STAVŮ'); drum();
    move('sm',690,150);
    panel.innerHTML=`<div class="log"><div class="eyebrow">Konec bitvy · asi za dvě hodiny</div>
      <p>Bitva na Bílé hoře trvala jen <b>asi dvě hodiny</b>. <b>České stavy prohrály.</b> Zvítězilo vojsko císaře Ferdinanda II. a Katolické ligy.</p></div>
      ${guide('Bylo jedno, jak ses rozhodoval. <b>Dějiny se změnit nedají</b>, ale můžeme pochopit, proč to tak dopadlo.')}
      <div class="fact red"><b>Proč stavy prohrály?</b><br>· Vojáci dlouho <b>nedostávali žold</b> a nechtělo se jim bojovat.<br>· Nepřítel měl <b>víc vojáků</b> a zkušené velitele (Buquoy, Tilly).<br>· Stavy byly <b>nejednotné</b> a slíbená pomoc z ciziny nepřišla.<br>· Valy na kopci nebyly dokončené a uherská jízda utekla jako první.</div>
      ${quizBlock({img:'fallen',cap:'Na Bílé hoře padly tisíce vojáků',h:'Vzpomeň si, kdo utíkal z bojiště a čí král pak musel opustit Prahu.',q:'Kdo prohrál bitvu na Bílé hoře 8. listopadu 1620?',o:['Císař Ferdinand II.','České stavy a jejich král Fridrich Falcký','Katolická liga'],a:1,ok:'Správně. Po porážce stavů začala pro české země těžká doba.'},()=>{giveSeal('bitva'); panel.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn brass" id="nx">Cestovat do roku 1621</button></div>`); $('#nx').onclick=()=>travel('po');})}`;
  }

  panel.innerHTML=`${guide('Jsme na kopci mezi stavovskými vojáky. Ty jsi teď <b>pobočník velitele</b>. Budeš rozhodovat, co dělat. Vezmi si ale k srdci jednu věc: pozorně čti, protože se tu dozvíš, jak bitva opravdu probíhala.')}<div class="row"><button class="btn" id="go">Zahájit bitvu</button></div>`;
  $('#go').onclick=()=>{ drum(); runPhase(); };
};

/* ---------- 6. PO BITVĚ ---------- */
SCENES.po=()=>{
  const cards=[
    {f:'Zimní král',b:'Hned po bitvě <b>Fridrich Falcký utekl</b> z Prahy a už se nevrátil. Vládl jen jednu zimu, proto mu lidé posměšně říkají <b>„zimní král“</b>.'},
    {f:'21. 6. 1621',b:'Na <b>Staroměstském náměstí</b> bylo popraveno <b>27 vůdců povstání</b>, pánů, rytířů i měšťanů. Na jejich památku je dnes v dlažbě u radnice <b>27 křížů</b>.'},
    {f:'Majetky',b:'Šlechticům, kteří stáli proti císaři, byly <b>zabaveny statky a zámky</b>. Získali je hlavně šlechtici věrní Habsburkům.'},
    {f:'1627',b:'Ferdinand II. vydal <b>Obnovené zřízení zemské</b>. Jediným povoleným náboženstvím bylo <b>katolické</b>. Němčina měla stejná práva jako čeština a Habsburkové se stali dědičnými českými králi.'},
    {f:'Exulanti',b:'Kdo nechtěl změnit víru, musel <b>odejít z vlasti</b>. Odešly desetitisíce lidí. Mezi nimi i <b>Jan Amos Komenský</b>, „učitel národů“.'},
    {f:'1618–1648',b:'Válka, která začala defenestrací, se rozšířila po celé Evropě. Trvala 30 let, proto se jmenuje <b>třicetiletá válka</b>. Skončila až roku 1648.'},
  ];
  let opened=new Set();
  const PICS=[['winter','Zimní král utíká z Prahy'],['crosses','Kříže v dlažbě připomínají popravené'],['castle','Zámky a statky dostali věrní císaře'],['majestat','Nový zákon: Obnovené zřízení zemské'],['exile','Exulanti odcházejí z vlasti'],['war30','Třicet let války']];
  stage.innerHTML=`
  <div class="eyebrow">Kapitola 6 · Praha, 1621 a dál</div>
  <h2>Co přišlo po Bílé hoře</h2>
  ${winterScene()}
  ${guide('Praha je smutná a tichá. Na náměstích stojí císařští vojáci. <b>Otoč všech šest karet</b> a zjistíš, jak bitva změnila život v Čechách na dlouhá léta.')}
  ${cast(['ferdinand','fridrich','komensky'])}
  <div class="cards">${cards.map((c,i)=>`<button class="flip" data-i="${i}" aria-label="Otočit kartu ${c.f}"><div class="in"><div class="f"><span class="big">${c.f}</span><span class="hint2">klikni a otoč</span></div><div class="b"><div class="bpic">${ILL[PICS[i][0]]()}</div><div>${c.b}</div></div></div></button>`).join('')}</div>
  <div id="after"></div>`;
  $('#wkPlay').onclick=()=>runWinter(); setTimeout(()=>{ if(S.scene==='po') runWinter(); },700);
  document.querySelectorAll('.flip').forEach(b=>b.onclick=()=>{ b.classList.toggle('open'); tone(420,.15,.08,'triangle'); opened.add(+b.dataset.i); if(opened.size===cards.length && !$('#after').innerHTML){ giveSeal('po'); $('#after').innerHTML=`${guide('Máš všech šest pečetí! Teď tě čeká poslední <b>zkouška kronikáře</b>. Stroj času tě přitom vrátí domů do přítomnosti.')}<div class="row"><button class="btn brass" id="nx">Zpět do roku 2026 a ke zkoušce</button></div>`; $('#nx').onclick=()=>travel('zkouska'); } });
};

/* ---------- ZKOUŠKA ---------- */
SCENES.zkouska=()=>{
  setYear(2026);
  const Q=[
    {img:'castle',cap:'Noc nad Pražským hradem',q:'Ve kterém městě sídlil císař Rudolf II.?',o:['Ve Vídni','V Praze','V Madridu'],a:1,h:'Hvězdáři Brahe a Kepler pracovali na hradě nad Vltavou.'},
    {img:'majestat',cap:'Listina s pečetí z roku 1609',q:'Co povoloval Rudolfův majestát z roku 1609?',o:['Svobodu víry','Výrobu zlata','Stavbu hradů'],a:0,h:'Šlo o to, jak smějí lidé věřit v Boha.'},
    {img:'brothers',cap:'Spor o korunu',q:'Kdo byl Matyáš?',o:['Hvězdář na dvoře','Rudolfův bratr, který ho připravil o trůn','Velitel na Bílé hoře'],a:1,h:'Podívej se na obrázek. Kdo se tu přetahuje o korunu?'},
    {img:'window',cap:'Let z okna',q:'Kdy byla druhá pražská defenestrace?',o:['23. května 1618','8. listopadu 1620','6. července 1415'],a:0,h:'Stalo se to na jaře. Ze stejného roku je začátek třicetileté války.'},
    {img:'window',cap:'Kdo letěl z okna?',q:'Kdo byl vyhozen z okna Pražského hradu?',o:['Thurn a Komenský','Martinic, Slavata a písař Fabricius','Rudolf a Matyáš'],a:1,h:'Byli to dva místodržící a jeden písař.'},
    {img:'vote',cap:'Volba krále',q:'Koho zvolily české stavy roku 1619 králem?',o:['Ferdinanda II.','Jana Jiřího Saského','Fridricha Falckého'],a:2,h:'Byl to mladý evangelík, zeť anglického krále.'},
    {img:'camp',cap:'Ráno před bitvou',q:'Kdy se odehrála bitva na Bílé hoře?',o:['8. listopadu 1620','23. května 1618','21. června 1621'],a:0,h:'Bylo to na podzim, dva roky po defenestraci.'},
    {img:'clash',cap:'Boj na Bílé hoře',q:'Kdo bitvu na Bílé hoře prohrál?',o:['Katolická liga','České stavy','Císař Ferdinand II.'],a:1,h:'Vítězem byl Habsburk. Kdo tedy stál proti němu?'},
    {img:'winter',cap:'Útěk z Prahy',q:'Proč se Fridrichovi říká „zimní král“?',o:['Narodil se v zimě','Vládl jen asi jednu zimu','Měl rád sníh'],a:1,h:'Korunovali ho v listopadu 1619 a za rok už utíkal.'},
    {img:'war30',cap:'Přesýpací hodiny války',q:'Jaká válka začala defenestrací roku 1618?',o:['Stoletá válka','Husitské války','Třicetiletá válka'],a:2,h:'Spočítej, kolik let je mezi roky 1618 a 1648.'},
  ];
  let i=0, score=0;
  lock('exam');
  stage.innerHTML=`<div class="eyebrow">Zkouška kronikáře · zpátky v roce 2026</div><h2>Velká zkouška</h2><p>Deset otázek. Za každou správnou odpověď na první pokus dostaneš bod. Když si nevíš rady, zeptej se Jakuba. Postavy ti ale teď nenapoví!</p>${cast(['rudolf','matyas','ferdinand','fridrich','thurn','komensky'])}<div id="qq"></div>`;
  function show(){
    const q=Q[i]; let first=true;
    $('#qq').innerHTML=`<p class="hint">Otázka ${i+1} z ${Q.length} · body: ${score}</p>${illus(q.img,q.cap)}<p class="lead"><b>${q.q}</b></p><div class="choices">${q.o.map((o,k)=>`<button class="choice" data-k="${k}">${o}</button>`).join('')}</div><button class="hintbtn" id="qh">Potřebuješ radu?</button><div id="qn"></div>`;
    $('#qh').onclick=()=>{ $('#qh').outerHTML=`<div class="hinttxt"><b>Rada od Jakuba:</b> ${q.h}</div>`; tone(880,.2,.08,'triangle'); };
    document.querySelectorAll('#qq .choice').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(k===q.a){ if(first)score++; b.classList.add('right'); chime(); document.querySelectorAll('#qq .choice').forEach(x=>x.disabled=true); const qh=$('#qh'); if(qh) qh.remove(); $('#qn').innerHTML=`<div class="row"><button class="btn" id="qnx">${i<Q.length-1?'Další otázka':'Zobrazit výsledek'}</button></div>`; $('#qnx').onclick=()=>{ i++; i<Q.length?show():cert(); }; } else { first=false; b.classList.add('wrong'); b.disabled=true; buzz(); } });
  }
  function cert(){
    unlock('exam');
    S.quizScore=score;
    const rank= score>=9?'Mistr kronikář Bílé hory': score>=6?'Kronikář Bílé hory':'Učeň kronikáře';
    const nm=S.name||'Neznámý cestovatel';
    stage.innerHTML=`<div class="eyebrow">Výprava dokončena</div>
    <div class="cert">
      <div class="eyebrow">Listina vydaná na Pražském hradě</div>
      <h2>${rank}</h2>
      <p style="margin:0 auto">Tímto se potvrzuje, že</p>
      <div class="name">${esc(nm)}</div>
      <p style="margin:0 auto .6em">cestoval(a) časem do let 1609–1621, získal(a) <b>${S.seals.length} ze 6 pečetí</b> a ve zkoušce dosáhl(a) <b>${score} z ${Q.length} bodů</b>.</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${CH.map((c,i)=>`<span class="certseal"><span class="seal stampin ${S.seals.includes(c.id)?'got':''}" style="animation-delay:${.3+i*.25}s"><svg viewBox="0 0 20 20" fill="currentColor">${SEAL_ICON[c.id]}</svg></span><small>${c.name}</small></span>`).join('')}</div>
      <p style="margin:.8em auto 0;font-style:italic">Podepsán Jakub, písař z Pražského hradu</p>
    </div>
    <div class="fact"><b>Zapamatuj si:</b> Rudolf II. (Praha, Rudolfův majestát 1609) → Matyáš (1611, dvůr do Vídně) → defenestrace <b>23. 5. 1618</b> → stavy volí <b>Fridricha Falckého</b> (1619) → <b>Bílá hora 8. 11. 1620</b>, stavy prohrály → poprava 27 pánů (1621) → třicetiletá válka do 1648.</div>
    <div class="row"><button class="btn ghost" id="again">Zkusit zkoušku znovu</button><button class="btn brass" id="restart">Nová výprava od začátku</button></div>`;
    chime(); drum();
    $('#again').onclick=()=>SCENES.zkouska();
    $('#restart').onclick=()=>{ S.seals=[]; renderSeals(); travel('intro'); };
  }
  show();
};

/* ================= START ================= */
function start(d){ if(d&&d.S) S=Object.assign(S,d.S); renderSeals(); go(S.scene||'intro'); }
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
