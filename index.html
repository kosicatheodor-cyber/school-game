<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theodorovy hry</title>
<link rel="icon" href="img/logo-tj.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#f3f8ff; --panel:#ffffff; --ink:#14315e; --muted:#4f6585; --line:#d3e1f4;
  --blue:#2563c9; --blueSoft:#e3edfc; --green:#22994f; --greenSoft:#e2f5e9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a2e; --panel:#13253f; --ink:#f2f7ff; --muted:#a7b9d4; --line:#28426a;
    --blue:#6ea3ff; --blueSoft:#1a3358; --green:#5fd38c; --greenSoft:#163a2a;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a2e; --panel:#13253f; --ink:#f2f7ff; --muted:#a7b9d4; --line:#28426a;
  --blue:#6ea3ff; --blueSoft:#1a3358; --green:#5fd38c; --greenSoft:#163a2a;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",Arial,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;line-height:1.05;margin:0}
a{color:inherit}
a:focus-visible{outline:3px solid var(--green);outline-offset:3px}

header{display:flex;align-items:center;gap:16px;padding:10px 0 14px;margin-bottom:28px;border-bottom:4px solid;border-image:linear-gradient(90deg,var(--blue),var(--green)) 1}
header h1{font-size:clamp(36px,7vw,56px);color:var(--blue)}
header h1 span{color:var(--green)}
.logo{width:clamp(60px,12vw,84px);height:auto;flex:none}

/* medailonek */
.profile{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:26px;margin-bottom:36px;box-shadow:0 6px 0 var(--line)}
.photo{width:170px;height:170px;border-radius:50%;object-fit:cover;border:5px solid var(--blue);outline:5px solid var(--green);outline-offset:0;background:var(--blueSoft)}
.profile h2{font-size:40px;margin-bottom:6px;color:var(--blue)}
.profile p{margin:0 0 16px}
.facts{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:0;padding:0}
.facts li{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:800;font-size:16px;background:var(--blueSoft);color:var(--blue)}
.facts li.club{background:var(--greenSoft);color:var(--green)}
.facts svg{width:22px;height:22px;flex:none}
.club-logo{margin:0;text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
.club-logo img{display:block;width:120px;height:auto;margin:0 auto 6px}
@media (max-width:760px){
  .profile{grid-template-columns:minmax(0,1fr);text-align:center;padding:22px 16px}
  .photo{margin:0 auto}
  .facts{justify-content:center}
}

/* menu her */
.games h2{font-size:34px;margin-bottom:14px;color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.card{display:flex;flex-direction:column;gap:6px;height:100%;text-decoration:none;background:var(--panel);border:2px solid var(--line);border-top:6px solid var(--blue);border-radius:16px;padding:18px 20px;transition:border-color .15s,transform .15s}
.grid li:nth-child(even) .card{border-top-color:var(--green)}
.card:hover{border-color:var(--blue);transform:translateY(-3px)}
.card b{font-family:"Baloo 2","Nunito",sans-serif;font-size:26px;line-height:1.1}
.card span{color:var(--muted);font-size:15px}
.card .go{margin-top:auto;padding-top:8px;color:var(--green);font-weight:800}
.status{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="img/logo-tj.svg" alt="Logo TJ" width="84" height="84">
    <h1>Theodorovy <span>hry</span></h1>
  </header>

  <section class="profile" aria-labelledby="who">
    <!-- Fotku nahraj jako img/theodor.jpg – dokud tam není, ukazuje se ilustrace. -->
    <img class="photo" src="img/theodor.jpg" alt="Theodor" onerror="this.onerror=null;this.src='img/theodor-ilustrace.svg'">
    <div>
      <h2 id="who">Theodor</h2>
      <p>Ahoj! Jsem žák 5. ročníku ZŠ Mochov. Ve volném čase hraju na bubny a fotbal za AFK Nehvizdy v kategorii mladších žáků. Tady najdeš hry, které jsem vytvořil.</p>
      <ul class="facts">
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l8-6 8 6v10H4z"/><path d="M10 20v-5h4v5"/></svg>
          5. ročník, ZŠ Mochov
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="9" rx="8" ry="3"/><path d="M4 9v7c0 1.7 3.6 3 8 3s8-1.3 8-3V9"/><path d="M8 2l3 5M16 2l-3 5"/></svg>
          Bubny
        </li>
        <li class="club">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 7V3M16 10l4-1.5M14.5 14.5l2.5 3.5M9.5 14.5L7 18M8 10L4 8.5"/></svg>
          AFK Nehvizdy, mladší žáci
        </li>
      </ul>
    </div>
    <figure class="club-logo">
      <img src="img/afk-nehvizdy.png" alt="Znak AFK Nehvizdy" width="547" height="694">
      <figcaption>AFK Nehvizdy</figcaption>
    </figure>
  </section>

  <section class="games" aria-labelledby="games-title">
    <h2 id="games-title">Hry</h2>
    <p class="status" id="status">Načítám hry…</p>
    <ul class="grid" id="games"></ul>
  </section>
</div>

<script>
// Menu se skládá automaticky ze všech .html stránek ve složce hry/.
// Na GitHub Pages se seznam bere z GitHub API, lokálně (např. `python3 -m http.server`)
// z výpisu složky, který server vrací.
const FOLDER = 'hry';
const FALLBACK_REPO = 'kosicatheodor-cyber/school-game';

function githubRepo() {
  const host = location.hostname;
  if (host.endsWith('.github.io')) {
    const owner = host.replace('.github.io', '');
    const first = location.pathname.split('/').filter(Boolean)[0];
    const repo = first && !first.endsWith('.html') ? first : host;
    return owner + '/' + repo;
  }
  return FALLBACK_REPO;
}

async function fromDirectoryListing() {
  const res = await fetch(FOLDER + '/');
  if (!res.ok) throw new Error('no listing');
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  return [...doc.querySelectorAll('a[href]')]
    .map(a => decodeURIComponent(a.getAttribute('href').split('/').pop()))
    .filter(name => name.endsWith('.html') && name !== 'index.html');
}

async function fromGitHub() {
  const res = await fetch('https://api.github.com/repos/' + githubRepo() + '/contents/' + FOLDER);
  if (!res.ok) throw new Error('GitHub API ' + res.status);
  return (await res.json())
    .filter(f => f.type === 'file' && f.name.endsWith('.html') && f.name !== 'index.html')
    .map(f => f.name);
}

function prettyName(file) {
  const s = file.replace(/\.html$/, '').replace(/[-_]+/g, ' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

async function describe(file) {
  const href = FOLDER + '/' + encodeURIComponent(file);
  try {
    const res = await fetch(href);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const desc = doc.querySelector('meta[name="description"]');
    return { href, title: doc.title.trim() || prettyName(file), desc: desc ? desc.content : '' };
  } catch {
    return { href, title: prettyName(file), desc: '' };
  }
}

async function buildMenu() {
  const status = document.getElementById('status');
  const list = document.getElementById('games');
  let files;
  try { files = await fromDirectoryListing(); }
  catch {
    try { files = await fromGitHub(); }
    catch { status.textContent = 'Seznam her se nepodařilo načíst.'; return; }
  }
  files = [...new Set(files)];
  if (!files.length) { status.textContent = 'Zatím tu nejsou žádné hry.'; return; }

  const games = await Promise.all(files.map(describe));
  games.sort((a, b) => a.title.localeCompare(b.title, 'cs'));
  for (const g of games) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'card';
    a.href = g.href;
    const b = document.createElement('b'); b.textContent = g.title; a.append(b);
    if (g.desc) { const s = document.createElement('span'); s.textContent = g.desc; a.append(s); }
    const go = document.createElement('span'); go.className = 'go'; go.textContent = 'Hrát →'; a.append(go);
    li.append(a); list.append(li);
  }
  status.remove();
}

buildMenu();
</script>
</body>
</html>
