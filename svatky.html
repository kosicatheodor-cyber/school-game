<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Svátky a dny</title>
<meta name="description" content="Co se slaví během roku – svátky, tradice a zajímavosti pro děti.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<script src="/hra.js"></script>
<style>
:root{
  --bg:#eef4ff; --panel:#ffffff; --ink:#14315e; --muted:#4f6585; --line:#d3e1f4;
  --blue:#2563c9; --blueSoft:#e3edfc; --green:#22994f; --greenSoft:#e2f5e9; --sun:#fff4cc; --sunInk:#7a5a00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a2e; --panel:#13253f; --ink:#f2f7ff; --muted:#a7b9d4; --line:#28426a;
    --blue:#6ea3ff; --blueSoft:#1a3358; --green:#5fd38c; --greenSoft:#163a2a; --sun:#3a3214; --sunInk:#ffe28a;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a2e; --panel:#13253f; --ink:#f2f7ff; --muted:#a7b9d4; --line:#28426a;
  --blue:#6ea3ff; --blueSoft:#1a3358; --green:#5fd38c; --greenSoft:#163a2a; --sun:#3a3214; --sunInk:#ffe28a;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",Arial,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:64px 16px 64px}
h1,h2,h3{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;line-height:1.1;margin:0}
h1{font-size:clamp(40px,8vw,60px);color:var(--blue)}
.intro{margin:6px 0 22px;font-size:20px;color:var(--muted);max-width:36em}

.nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px;padding:0;list-style:none}
.nav a{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;background:var(--panel);border:2px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.nav a:hover{border-color:var(--blue)}
.nav a.now{background:var(--blue);border-color:var(--blue);color:#fff}
.nav a:focus-visible,.card a:focus-visible,.quiz button:focus-visible{outline:3px solid var(--green);outline-offset:2px}

.list{display:flex;flex-direction:column;gap:22px}
.card{position:relative;background:var(--panel);border:2px solid var(--line);border-left:10px solid var(--c,var(--blue));border-radius:22px;padding:22px 26px 24px;scroll-margin-top:24px}
.card.now{box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--blue)) 35%,transparent)}
.card:target{animation:svit 1.6s ease-out}
@keyframes svit{from{box-shadow:0 0 0 14px color-mix(in srgb,var(--c,var(--blue)) 45%,transparent)}}
.head{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.emoji{flex:none;font-size:56px;line-height:1}
.head h2{font-size:clamp(28px,5vw,36px);color:var(--c,var(--blue))}
.date{font-weight:800;color:var(--muted);font-size:16px}
.badge{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;background:var(--c,var(--blue));color:#fff;font-size:13px;font-weight:800;vertical-align:2px}
.card p{margin:0 0 12px}
.card h3{font-size:20px;margin:14px 0 6px}
.card ul{margin:0 0 12px;padding-left:22px}
.card li{margin:2px 0}
.fact{margin:14px 0 0;padding:12px 16px;border-radius:14px;background:var(--sun);color:var(--ink)}
.fact b{color:var(--sunInk)}
.quiz{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--blueSoft)}
.quiz .q{font-weight:800;margin:0 0 8px}
.quiz .opts{display:flex;flex-wrap:wrap;gap:8px}
.quiz button{font:inherit;font-weight:700;font-size:16px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.quiz button:hover{border-color:var(--blue)}
.quiz button.ok{background:var(--green);border-color:var(--green);color:#fff}
.quiz button.bad{background:#c0392b;border-color:#c0392b;color:#fff}
.quiz .res{margin:8px 0 0;font-weight:800;min-height:1.5em}
.quiz .res.ok{color:var(--green)}
.quiz .res.bad{color:#c0392b}
.more{display:inline-block;margin-top:14px;font-weight:800;color:var(--c,var(--blue))}
/* Sváteční obrázky na pozadí tu jen jemně, ať se dobře čte. */
.sz-pozadi .sz-o{opacity:.35}
@media (max-width:560px){
  .card{padding:18px 18px 20px;border-left-width:7px}
  .emoji{font-size:44px}
}
</style>
</head>
<body>
<main class="wrap">
  <h1>Svátky a dny</h1>
  <p class="intro">Co se během roku slaví a proč? Najdeš tu svátky, tradice i zajímavosti. Na konci každého svátku je malý kvíz – zkus ho!</p>
  <ul class="nav" id="nav" aria-label="Rychlý skok na svátek"></ul>
  <div class="list" id="list"></div>
</main>

    kviz: { q: 'Co udělal Martin se svým pláštěm?', a: ['prodal ho', 'rozdělil se o něj s žebrákem', 'ztratil ho'], ok: 1 },
  },
  '17-listopad': {
    e: '🔑', c: C.modra, datum: '17. listopadu',
    co: 'Den boje za svobodu a demokracii. 17. listopadu 1939 zavřeli nacisté české vysoké školy. A 17. listopadu 1989 začala studentskou demonstrací v Praze sametová revoluce, která ukončila vládu komunistů.',
    jak: ['je státní svátek', 'lidé nosí svíčky a květiny na Národní třídu v Praze', 'připomínáme si, jak je svoboda důležitá'],
    fakt: 'V roce 1989 lidé na náměstích cinkali klíči – jako by říkali „zvoníme vám konec“. Prezidentem se pak stal Václav Havel.',
    kviz: { q: 'Čím lidé v roce 1989 cinkali na náměstích?', a: ['lžičkami', 'klíči', 'zvonečky'], ok: 1 },
  },
  mikulas: {
    e: '😇', c: C.cervena, datum: '5. prosince večer',
    co: 'Svatý Mikuláš byl biskup ve městě Myra (dnes je to Turecko). Pomáhal chudým a potají jim daroval peníze. Jeho svátek je 6. prosince, ale nadílka chodí už večer předtím.',
    jak: ['Mikuláš chodí s andělem a čertem', 'děti řeknou básničku nebo zazpívají písničku', 'hodné děti dostanou nadílku, zlobivé prý uhlí nebo bramboru'],
    fakt: 'Podle legendy Mikuláš hodil chudé rodině komínem měšec zlaťáků – a ten spadl do punčochy, která se sušila u krbu.',
    kviz: { q: 'S kým chodí Mikuláš?', a: ['s andělem a čertem', 's Ježíškem', 's Krakonošem'], ok: 0 },
  },
  vanoce: {
    e: '🎄', c: C.zelena, datum: '24.–26. prosince',
    co: 'O Vánocích slavíme narození Ježíše Krista. Je to svátek rodiny, pohody a obdarovávání. Nejdůležitější je Štědrý den 24. prosince.',
    jak: ['zdobíme stromeček a pečeme cukroví', 'k večeři bývá kapr a bramborový salát', 'u nás dárky nosí Ježíšek', 'rozkrojí se jablko – hvězdička uvnitř znamená zdraví'],
    fakt: 'Ježíškova pošta je v Božím Daru v Krušných horách. Kdo se na Štědrý den celý den postí, uvidí prý zlaté prasátko!',
    kviz: { q: 'Co znamená hvězdička v rozkrojeném jablku?', a: ['zdraví', 'nemoc', 'cestování'], ok: 0 },
  },
};

const MESICE = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
const den = d => d.getDate() + '. ' + MESICE[d.getMonth()];
function datumText(id, s, y) {
  const o = OBSAH[id];
  if (o.datum) return o.datum;
  const [from, to] = s.rozsahy(y)[0];
  if (id === 'masopust') return 'do ' + den(to) + ' ' + y + ' (masopustní úterý)';
  if (id === 'velikonoce') return 'Velikonoční neděle ' + den(new Date(to.getFullYear(), to.getMonth(), to.getDate() - 1)) + ' ' + y;
  return den(from) === den(to) ? den(from) : den(from) + ' – ' + den(to);
}

// Řazení: od dnešního svátku po kalendáři dál, celý rok dokola.
const today = new Date(); today.setHours(0, 0, 0, 0);
// Kdy svátek opravdu je (sváteční výzdoba někdy začíná dřív, třeba Vánoce už v listopadu).
const KDY = { 'novy-rok': [12, 31], zima: [12, 21], podzim: [9, 22], prazdniny: [7, 1], halloween: [10, 31], vanoce: [12, 24], mikulas: [12, 5] };
function nextStart(s) {
  const y0 = today.getFullYear();
  const active = s.rozsahy(y0).some(([from, to]) => from <= today && today <= to);
  if (active) return { at: today.getTime(), y: y0 };
  if (KDY[s.id]) {
    const [m, d] = KDY[s.id];
    const t = new Date(y0, m - 1, d);
    return t >= today ? { at: t.getTime(), y: y0 } : { at: new Date(y0 + 1, m - 1, d).getTime(), y: y0 + 1 };
  }
  for (const y of [today.getFullYear(), today.getFullYear() + 1]) {
    const starts = s.rozsahy(y).filter(([, to]) => to >= today).map(([from]) => from);
    if (starts.length) return { at: Math.min(...starts), y };
  }
  return { at: Infinity, y: today.getFullYear() };
}

const nowId = window.SVATEK ? window.SVATEK.id : null;
const items = (window.SVATKY_SEZNAM || []).filter(s => OBSAH[s.id]).map(s => ({ s, ...nextStart(s) }));
items.sort((a, b) => (b.s.id === nowId) - (a.s.id === nowId) || a.at - b.at);

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const nav = document.getElementById('nav');
const list = document.getElementById('list');
for (const { s, y } of items) {
  const o = OBSAH[s.id];
  const now = s.id === nowId;

  const li = el('li'); const a = el('a', now ? 'now' : '');
  a.href = '#' + s.id; a.append(el('span', '', o.e), el('span', '', s.nazev)); li.append(a); nav.append(li);

  const card = el('article', 'card' + (now ? ' now' : ''));
  card.id = s.id; card.style.setProperty('--c', o.c);
  const head = el('div', 'head');
  const title = el('div');
  const h2 = el('h2', '', s.nazev);
  const date = el('div', 'date', datumText(s.id, s, y));
  if (now) date.append(el('span', 'badge', 'Právě teď'));
  title.append(h2, date);
  const emoji = el('span', 'emoji', o.e); emoji.setAttribute('aria-hidden', 'true');
  head.append(emoji, title);
  card.append(head, el('p', '', o.co), el('h3', '', 'Jak se slaví'));
  const ul = el('ul'); for (const t of o.jak) ul.append(el('li', '', t)); card.append(ul);
  const fact = el('p', 'fact'); fact.append(el('b', '', 'Věděl jsi, že…? '), document.createTextNode(o.fakt)); card.append(fact);

  const quiz = el('div', 'quiz');
  quiz.append(el('p', 'q', '❓ ' + o.kviz.q));
  const opts = el('div', 'opts'); const res = el('p', 'res'); res.setAttribute('role', 'status');
  o.kviz.a.forEach((txt, i) => {
    const b = el('button', '', txt); b.type = 'button';
    b.addEventListener('click', () => {
      opts.querySelectorAll('button').forEach(x => x.classList.remove('ok', 'bad'));
      if (i === o.kviz.ok) { b.classList.add('ok'); res.className = 'res ok'; res.textContent = 'Správně! 🎉'; }
      else { b.classList.add('bad'); res.className = 'res bad'; res.textContent = 'Ještě jednou – zkus jinou odpověď.'; }
    });
    opts.append(b);
  });
  quiz.append(opts, res); card.append(quiz);

  const more = el('a', 'more', 'Podívej se, jak web vypadá o tomhle svátku →'); more.href = '/?svatek=' + s.id;
  card.append(more);
  list.append(card);
}
// Po načtení skoč na svátek z adresy (např. svatky.html#vanoce).
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
</script>
